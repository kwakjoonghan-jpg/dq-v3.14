/* ══ 6번: 캘린더 (연속 그래픽 및 기한초과 반영) ══ */
function questColor(q){
  const palette=['#3b82f6','#00c471','#f5a623','#8b5cf6','#ec4899','#14b8a6','#f97316','#06b6d4','#a3e635','#ef4444','#6366f1','#eab308'];
  const key=String(q?.id||q?.title||'');
  let h=0;
  for(let i=0;i<key.length;i++) h=(h*31+key.charCodeAt(i))>>>0;
  return palette[h%palette.length];
}
function hexToRgba(hex,a=.18){
  const h=String(hex||'#3b82f6').replace('#','');
  const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ══ 6번: 캘린더 (퀘스트별 컬러 구간 및 기한초과 반영) ══ */
function renderCalendar(){
  const MONTHS=['1월','2월','3월','4월','5월','6월','7월','8월','9월','10월','11월','12월'];
  const DOWS=['일','월','화','수','목','금','토'];
  const firstDay=new Date(calYear,calMonth,1).getDay();
  const daysInMonth=new Date(calYear,calMonth+1,0).getDate();
  const prevDays=new Date(calYear,calMonth,0).getDate();
  
  /* 날짜별 완료 로그 집계 */
  const logsByDate={};
  QL.forEach(l=>{
    const d=l.completedAt?new Date(l.completedAt):null;
    if(!d||isNaN(d))return;
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    if(!logsByDate[key])logsByDate[key]=[];
    logsByDate[key].push(l);
  });
  
  /* 진행중 및 예정인 활성 퀘스트 */
  const activeQuests=Q.filter(q=>q.status!=='완료');
  const rangeQuests=activeQuests.filter(q=>q.startDate&&q.dueDate);

  /* 셀 생성 */
  let cells=[];
  for(let i=0;i<firstDay;i++){const d=prevDays-firstDay+1+i;cells.push({d,cur:false,key:null})}
  for(let d=1;d<=daysInMonth;d++){
    const key=`${calYear}-${String(calMonth+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    cells.push({d,cur:true,key});
  }
  const remain=42-cells.length;
  for(let d=1;d<=remain;d++)cells.push({d,cur:false,key:null});
  
  let grid='';
  cells.forEach((cell)=>{
    if(!cell.cur){grid+=`<div class="cal-cell other-month"><div class="cal-date">${cell.d}</div></div>`;return}
    const isToday=cell.key===TODAYSTR;
    const isSel=cell.key===calSelDate;
    const logs=logsByDate[cell.key]||[];
    const cellDate=TODATE(cell.key);
    
    /* 1. 이 날짜에 걸쳐 있는 퀘스트를 각 퀘스트 고유 색상 바(bar)로 표시 */
    const inRangeQuests = rangeQuests.filter(q => cellDate >= TODATE(q.startDate) && cellDate <= TODATE(q.dueDate));
    let rangeBars='';
    inRangeQuests.slice(0,4).forEach(q=>{
      let cls='range-mid';
      if(q.startDate===cell.key && q.dueDate===cell.key) cls='range-only';
      else if(q.startDate===cell.key) cls='range-start';
      else if(q.dueDate===cell.key) cls='range-end';
      const color=questColor(q);
      rangeBars+=`<div class="cal-range-bar ${cls}" title="${esc(q.title)}" style="background:${color}"></div>`;
    });
    if(inRangeQuests.length>4) rangeBars+=`<div class="cal-more">+${inRangeQuests.length-4}</div>`;

    /* 2. 기한 초과 퀘스트 확인 (마감일이 지났고 진행중인 것) */
    const isOverdueDay = activeQuests.some(q => q.status==='진행중' && q.dueDate===cell.key && TODATE(q.dueDate)<TODAY);
    const deadlineClass = isOverdueDay ? ' deadline' : '';
    
    /* 3. 점 표시 로직: 완료 로그 + 시작일/마감일을 퀘스트 고유 색상으로 표시 */
    let dots='';
    if(logs.length>0) dots+=`<div class="cal-dot cal-dot-log"></div>`.repeat(Math.min(logs.length,3));
    const eventQuests=activeQuests.filter(q => q.startDate===cell.key || q.dueDate===cell.key);
    eventQuests.slice(0,4).forEach(q=>{
      const overdue=q.status==='진행중' && q.dueDate===cell.key && TODATE(q.dueDate)<TODAY;
      dots+=`<div class="cal-dot" title="${esc(q.title)}" style="background:${overdue?'var(--red)':questColor(q)}"></div>`;
    });

    // 투데이(Today) 마커: 오늘 날짜인데 해결 안 된 기한 초과 퀘스트가 있다면 빨간 점 추가
    if(isToday && activeQuests.some(q => q.status==='진행중' && q.dueDate && TODATE(q.dueDate)<TODAY)){
       if(!isOverdueDay) dots+=`<div class="cal-dot cal-dot-overdue"></div>`;
    }
    
    grid+=`<div class="cal-cell${deadlineClass}${isToday?' today':''}${isSel?' selected':''}" onclick="calSelDate=calSelDate==='${cell.key}'?null:'${cell.key}';render()">
      <div class="cal-date">${cell.d}</div>
      ${dots?`<div class="cal-dot-wrap">${dots}</div>`:''}
      ${rangeBars?`<div class="cal-range-stack">${rangeBars}</div>`:''}
    </div>`;
  });
  
  /* 선택 날짜 퀘스트 목록 상세 표시 */
  let selInfo='';
  if(calSelDate){
    const dayLogs=logsByDate[calSelDate]||[];
    const dDate=TODATE(calSelDate);
    
    // 이 날짜가 포함된 퀘스트 (시작일, 진행중, 마감일)
    const dayQuests=activeQuests.filter(q=>{
      const s=q.startDate?TODATE(q.startDate):null;
      const e=q.dueDate?TODATE(q.dueDate):null;
      if(s&&e) return dDate>=s && dDate<=e;
      if(s&&!e) return q.startDate===calSelDate;
      if(!s&&e) return q.dueDate===calSelDate;
      return false;
    });
    
    // 오늘 날짜 선택 시, 모든 기한 초과 퀘스트 표시
    const overdueList = (calSelDate===TODAYSTR) 
      ? activeQuests.filter(q=>q.status==='진행중' && q.dueDate && TODATE(q.dueDate)<TODAY) 
      : activeQuests.filter(q=>q.status==='진행중' && q.dueDate===calSelDate && TODATE(q.dueDate)<TODAY);

    selInfo=`<div class="cal-quest-list">
      <div style="font-size:12px;font-weight:700;color:var(--t2);margin-bottom:8px">${calSelDate}</div>`;
    
    if(dayLogs.length>0){
      selInfo+=`<div style="font-size:11px;color:var(--green);font-weight:600;margin-bottom:5px">✅ 완료 로그 ${dayLogs.length}건 (+${W(dayLogs.reduce((s,l)=>s+l.earnedReward,0))})</div>`;
      dayLogs.forEach(l=>{selInfo+=`<div class="cal-quest-item"><div class="cal-quest-dot" style="background:var(--green)"></div><div class="cal-quest-name">${esc(l.questTitleSnapshot)}</div><div class="cal-quest-type">+${W(l.earnedReward)}</div></div>`});
    }
    
    // 기한 초과 리스트 강력하게 표시 (빨간색 + 원래 퀘스트 색상 라벨)
    if(overdueList.length>0){
      selInfo+=`<div style="font-size:11px;color:var(--red);font-weight:600;margin:8px 0 5px">⚠️ 기한 초과 퀘스트</div>`;
      overdueList.forEach(q=>{
        const color=questColor(q);
        selInfo+=`<div class="cal-quest-item" onclick="questForm('${q.id}');"><div class="cal-quest-dot" style="background:${color};box-shadow:0 0 0 2px var(--red)"></div><div class="cal-quest-name" style="color:var(--red);font-weight:700">${esc(q.title)}</div><div class="cal-quest-type" style="color:var(--red)">마감: ${q.dueDate}</div></div>`;
      });
    }

    // 일반 일정 표시
    const normalDayQuests = dayQuests.filter(q => !overdueList.some(oq => oq.id === q.id));
    if(normalDayQuests.length>0){
      selInfo+=`<div style="font-size:11px;color:var(--blue);font-weight:600;margin:8px 0 5px">📅 퀘스트 일정</div>`;
      normalDayQuests.forEach(q=>{
        let typeStr = '진행중';
        if(q.startDate===calSelDate && q.dueDate===calSelDate) typeStr = '시작/마감';
        else if(q.startDate===calSelDate) typeStr = '시작일';
        else if(q.dueDate===calSelDate) typeStr = '마감일';
        const color=questColor(q);
        selInfo+=`<div class="cal-quest-item" onclick="questForm('${q.id}');"><div class="cal-quest-dot" style="background:${color}"></div><div class="cal-quest-name">${esc(q.title)}</div><div class="cal-quest-type">${typeStr}</div></div>`;
      });
    }
    
    if(!dayLogs.length && !overdueList.length && !normalDayQuests.length) {
      selInfo+=`<div style="font-size:12px;color:var(--t3)">이 날의 기록이 없어요</div>`;
    }
    selInfo+=`</div>`;
  }
  
  const legendQuests=rangeQuests.slice(0,6);
  return`<div class="cal-wrap">
    <div class="cal-header">
      <button class="cal-nav" onclick="calMonth--;if(calMonth<0){calMonth=11;calYear--}calSelDate=null;render()">‹</button>
      <div class="cal-month">${calYear}년 ${MONTHS[calMonth]}</div>
      <button class="cal-nav" onclick="calMonth++;if(calMonth>11){calMonth=0;calYear++}calSelDate=null;render()">›</button>
    </div>
    <div class="cal-dow">${DOWS.map(d=>`<div class="cal-dow-cell">${d}</div>`).join('')}</div>
    <div class="cal-grid">${grid}</div>
    <div class="cal-legend">
      <div class="cal-legend-item"><div class="cal-dot cal-dot-log" style="width:8px;height:8px"></div>완료 기록</div>
      <div class="cal-legend-item"><div style="width:12px;height:8px;background:linear-gradient(90deg,#3b82f6,#f5a623,#8b5cf6);border-radius:2px"></div>퀘스트별 기간 색상</div>
      <div class="cal-legend-item"><div style="width:10px;height:10px;border:1px solid var(--red);border-radius:2px"></div>기한 초과</div>
    </div>
  </div>
  ${legendQuests.length?`<div class="cal-quest-list" style="margin-bottom:10px">
    <div style="font-size:11px;color:var(--t3);font-weight:700;margin-bottom:6px">진행 퀘스트 색상표</div>
    ${legendQuests.map(q=>`<div class="cal-quest-item" onclick="questForm('${q.id}')"><div class="cal-quest-dot" style="background:${questColor(q)}"></div><div class="cal-quest-name">${esc(q.title)}</div><div class="cal-quest-type">${q.startDate||'-'} ~ ${q.dueDate||'-'}</div></div>`).join('')}
    ${rangeQuests.length>6?`<div style="font-size:11px;color:var(--t3);padding-top:6px">외 ${rangeQuests.length-6}개는 날짜를 눌러 확인</div>`:''}
  </div>`:''}
  ${selInfo}`;
}

/* ══ FILE 관리 기능 ══ */
function exportJSON(){
  const data=makeDQBackupData();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`dq-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();
  toast('📤 JSON 파일로 내보냈어요!');
}
function importJSON(e){
  const file=e.target.files[0];if(!file)return;
  const reader=new FileReader();
  reader.onload=ev=>{
    try{
      const d=JSON.parse(ev.target.result);
      if(!d.quests||!d.rewards){toast('올바른 DQ 백업 파일이 아니에요','var(--red)');return}
      if(!confirm(`퀘스트 ${d.quests.length}개, 리워드 ${d.rewards.length}개를 가져올까요?\n현재 데이터가 교체됩니다.`))return;
      Q=d.quests;QL=d.questLogs||[];R=d.rewards;PL=d.purchaseLogs||[];P=normalizePersonaState(d.persona);RT=normalizeRoutineTransfers(d.routineTransfers||[]);
      saveAll();toast('📥 데이터를 가져왔어요!');render();
    }catch{toast('파일을 읽을 수 없어요','var(--red)')}
  };
  reader.readAsText(file);e.target.value='';
}
function resetToSample(){
  if(!confirm('노션 초기 데이터로 되돌릴까요?\n현재 데이터가 모두 사라집니다.'))return;
  Q=JSON.parse(JSON.stringify(SQ));QL=JSON.parse(JSON.stringify(SQL));
  R=JSON.parse(JSON.stringify(SR));PL=JSON.parse(JSON.stringify(SPL));P=createDefaultPersonaState();RT=[];
  localStorage.removeItem('dq_main_last_saved');
  saveAll();toast('🔄 초기 데이터로 되돌렸어요');render();
}
function deleteAll(){
  if(!confirm('정말요? 모든 데이터가 삭제됩니다.'))return;
  if(!confirm('두 번 확인할게요. 전체 삭제하시겠습니까?'))return;
  Q=[];QL=[];R=[];PL=[];P=createDefaultPersonaState();RT=[];localStorage.removeItem('dq_main_last_saved');
  saveAll();toast('🗑️ 전체 삭제됐어요','var(--red)');render();
}

    <div class="form-group"><label class="form-label">스토리</label><textarea class="form-textarea" id="qst">${esc(q.story||'')}</textarea></div>
    <div class="modal-btns">
      <button class="btn btn-blue" style="flex:1" onclick="_sqf('${q.id}',${!!eid})">저장</button>
      ${eid?`<button class="btn btn-red" onclick="_dqf('${q.id}')">삭제</button>`:''}
      <button class="btn btn-ghost" onclick="closeM()">취소</button>
    </div>
  </div></div>`);
}
window._sqf=(id,isE)=>{
  const t=document.getElementById('qt').value.trim();
  if(!t){toast('퀘스트명을 입력해주세요');return}
  const status=document.getElementById('qs').value;
  const d={id,title:t,type:document.getElementById('qy').value,reward:parseInt(document.getElementById('qr').value)||0,
    category:document.getElementById('qc').value,difficulty:document.getElementById('qd').value,status,active:true,
    condition:document.getElementById('qco').value,nextAction:document.getElementById('qnext')?.value||'',story:document.getElementById('qst').value,note:'',
    dueDate:document.getElementById('qdue').value||'',
    startDate:document.getElementById('qsd').value||'', // 시작일 항상 저장
    parentId:(document.getElementById('qparent')?.value||''),
    subOrder:parseInt(document.getElementById('qorder')?.value)||0
  };
  if(d.parentId===id)d.parentId='';
  if(d.parentId&&!d.subOrder)d.subOrder=nextSubOrder(d.parentId);
  if(isE){const i=Q.findIndex(q=>q.id===id);if(i>-1)Q[i]={...Q[i],...d}}
  else{d.completedCount=0;d.totalEarned=0;d.lastCompletedAt='';d.createdAt=new Date().toISOString();Q.push(d)}
  saveAll();closeM();toast(isE?'퀘스트 수정됐어요 ✓':'새 퀘스트 추가! ⚔️');render();
};
window._dqf=id=>{const subs=childQuests(id);let msg='삭제할까요?';if(subs.length)msg=`이 퀘스트에는 하위 퀘스트 ${subs.length}개가 있습니다.
부모만 삭제하고 하위 퀘스트는 독립 퀘스트로 유지할까요?`;if(!confirm(msg))return;subs.forEach(s=>{s.parentId='';s.subOrder=0});Q=Q.filter(q=>q.id!==id);saveAll();closeM();toast('삭제됐어요');render()};
function openConnectQuestModal(parentId){
  const parent=Q.find(q=>q.id===parentId);if(!parent)return;
  const candidates=Q.filter(q=>q.id!==parentId&&!q.parentId&&q.status!=='완료'&&!isParentQuest(q));
  openM(`<div class="modal-bg" onclick="if(event.target===this)closeM()"><div class="modal"><div class="modal-drag"></div><div class="modal-title">🔗 기존 퀘스트 연결</div><div class="modal-sub">「${esc(parent.title)}」의 하위 퀘스트로 연결할 항목을 선택하세요.</div>${candidates.length?candidates.map(q=>`<div class="qcard diff-${q.difficulty}" style="margin-bottom:8px" onclick="connectQuestToParent('${q.id}','${parentId}')"><div class="qcard-head"><div class="qcard-title">${CE[migrateCat(q.category)]||'📌'} ${esc(q.title)}</div><div class="qcard-reward">${W(q.reward||0)}</div></div><div class="qcard-tags"><span class="tag tag-cat">${esc(migrateCat(q.category))}</span><span class="tag tag-${q.difficulty}">${q.difficulty}등급</span></div></div>`).join(''):`<div class="empty"><div class="empty-ico">📭</div><div class="empty-txt">연결 가능한 독립 퀘스트가 없습니다.</div></div>`}<button class="btn btn-ghost" style="width:100%;justify-content:center;margin-top:8px" onclick="closeM()">닫기</button></div></div>`)
}
function connectQuestToParent(qid,parentId){const q=Q.find(x=>x.id===qid),p=Q.find(x=>x.id===parentId);if(!q||!p)return;q.parentId=parentId;q.subOrder=nextSubOrder(parentId);saveAll();closeM();OPEN_PARENTS=[...new Set([...OPEN_PARENTS,parentId])];saveOpenParents();toast('하위 퀘스트로 연결했어요 🔗');render()}


function rewardForm(eid=null){
  const r=eid?R.find(x=>x.id===eid):{id:uid(),title:'',cost:10000,rank:'B',rewardModule:'',rules:'',rcat:'food',remoji:'🍜',totalPurchasedCount:0,totalSpent:0,createdAt:new Date().toISOString()};
  const selCatKey=r.rcat||'food';
  const selCat=RC_CATS.find(c=>c.cat===selCatKey)||RC_CATS[0];
  const catBtns=RC_CATS.map(c=>`<div class="emoji-cat${c.cat===selCatKey?' sel':''}" id="ecat-${c.cat}" onclick="_selCat('${c.cat}')">​<span class="ec-ico">${c.emojis[0]}</span><span class="ec-lbl">${c.label}</span></div>`).join('');
  const chips=selCat.emojis.map(e=>`<button class="emoji-chip${r.remoji===e?' sel':''}" onclick="_selEmoji('${e}')" type="button">${e}</button>`).join('');
  openM(`<div class="modal-bg" onclick="if(event.target===this)closeM()"><div class="modal">
    <div class="modal-drag"></div>
    <div class="modal-title">${eid?'✏️ 리워드 수정':'🎁 새 리워드'}</div>
    <div class="form-group"><label class="form-label">카테고리</label><div class="emoji-picker" id="ecat-grid">${catBtns}</div></div>
    <div class="form-group"><label class="form-label">이모티콘</label>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:7px"><span style="font-size:30px;line-height:1" id="sel-emoji-preview">${r.remoji||selCat.emojis[0]}</span><span style="font-size:12px;color:var(--t3)">선택된 이모티콘</span></div>
      <div class="emoji-chips" id="emoji-chip-wrap">${chips}</div>
    </div>
    <div class="form-group"><label class="form-label">리워드명 *</label><input class="form-input" id="rt" value="${esc(r.title||'이름 없는 리워드')}" placeholder="리워드 이름"></div>
    <div class="g2">
      <div class="form-group"><label class="form-label">비용 (₩)</label><input class="form-input" id="rc" type="number" value="${r.cost}" min="0" oninput="_updateRewardRankPreview()"></div>
      <div class="form-group"><label class="form-label">자동 등급</label><input class="form-input" id="rr" value="${rewardRankLabel(rewardAutoRank(r.cost))}" readonly><div class="form-tip">금액 입력 시 자동 반영됩니다</div></div>
    </div>
    <div class="form-group"><label class="form-label">설명</label><input class="form-input" id="rm" value="${esc(r.rewardModule)}" placeholder="어떤 보상인가요?"></div>
    <div class="form-group"><label class="form-label">구매 규칙</label><textarea class="form-textarea" id="rru">${esc(r.rules)}</textarea></div>
    <div class="modal-btns">
      <button class="btn btn-blue" style="flex:1" onclick="_srf('${r.id}',${!!eid})">저장</button>
      ${eid?`<button class="btn btn-red" onclick="_drf('${r.id}')">삭제</button>`:''}
      <button class="btn btn-ghost" onclick="closeM()">취소</button>
    </div>
  </div></div>`);
  window._curCat=selCatKey;window._curEmoji=r.remoji||selCat.emojis[0];
}
window._selCat=cat=>{
  window._curCat=cat;const c=RC_CATS.find(x=>x.cat===cat);if(!c)return;
  document.querySelectorAll('.emoji-cat').forEach(el=>el.classList.remove('sel'));
  document.getElementById('ecat-'+cat)?.classList.add('sel');
  const wrap=document.getElementById('emoji-chip-wrap');
  if(wrap)wrap.innerHTML=c.emojis.map(e=>`<button class="emoji-chip" onclick="_selEmoji('${e}')" type="button">${e}</button>`).join('');
  window._selEmoji(c.emojis[0]);
};
window._selEmoji=emoji=>{
  window._curEmoji=emoji;const p=document.getElementById('sel-emoji-preview');if(p)p.textContent=emoji;
  document.querySelectorAll('.emoji-chip').forEach(el=>el.classList.toggle('sel',el.textContent===emoji));
};
window._updateRewardRankPreview=()=>{const el=document.getElementById('rr'),cost=document.getElementById('rc');if(el&&cost)el.value=rewardRankLabel(rewardAutoRank(Number(cost.value||0)));};
window._srf=(id,isE)=>{
  const t=document.getElementById('rt').value.trim();
  if(!t){toast('리워드명을 입력해주세요');return}
  const d={id,title:t,cost:parseInt(document.getElementById('rc').value)||0,rank:rewardAutoRank(parseInt(document.getElementById('rc').value)||0),rewardModule:document.getElementById('rm').value,rules:document.getElementById('rru').value,rcat:window._curCat||'food',remoji:window._curEmoji||'🎁'};
  if(isE){const i=R.findIndex(r=>r.id===id);if(i>-1)R[i]={...R[i],...d}}
  else{d.totalPurchasedCount=0;d.totalSpent=0;d.createdAt=new Date().toISOString();R.push(d)}
  saveAll();closeM();toast(isE?'리워드 수정됐어요 ✓':'새 리워드 추가! 🎁');render();
};
window._drf=id=>{if(!confirm('삭제할까요?'))return;R=R.filter(r=>r.id!==id);saveAll();closeM();toast('삭제됐어요');render()};

/* ══ NAV ══ */
const PC={dash:'대시보드',quests:'⚔️ 퀘스트',rewards:'🎁 리워드 마켓',calendar:'📅 캘린더',logs:'📋 로그',settings:'⚙️ 설정'};
function go(p){
  pg=p;
  // 기존 하단 네비게이션 버튼 초기화
  document.querySelectorAll('.bnav-btn').forEach(b=>b.classList.remove('on'));
  
  // 현재 탭 활성화 (설정 탭은 하단 네비게이션에 없으므로 옵셔널 체이닝 처리)
  document.getElementById('bn-'+p)?.classList.add('on');
  
  document.getElementById('fab').className='fab'+((p==='quests'||(p==='rewards'&&rMode==='real'))?' show':'');
  if(p==='calendar'){calYear=TODAY.getFullYear();calMonth=TODAY.getMonth();calSelDate=null}
  
  // 설정 화면에 진입한 경우 우측 상단 설정 아이콘을 숨김 처리
  const topSettingBtn = document.getElementById('topbar-settings-btn');
  if (topSettingBtn) {
    topSettingBtn.style.display = (p === 'settings') ? 'none' : 'block';
  }

  render();
}
function onFab(){pg==='quests'?questForm():pg==='rewards'?(rMode==='style'?openStyleGuide():rewardForm()):null}

function checkScheduled(){
  let changed=false;
  Q.forEach(q=>{
    if(q.status==='예정'&&q.startDate){
      const sd=new Date(q.startDate);if(isNaN(sd))return;
      sd.setHours(0,0,0,0);
      // 기한 유지(startDate 삭제 안함) 하면서 상태만 변경
      if(sd<=TODAY){q.status='진행중';changed=true;toast(`📅 "${q.title}" 퀘스트 시작!`)}
    }
  });
  if(changed)saveAll();
}

/* ══ RENDER ══ */
function render(){
  checkScheduled();
  document.getElementById('page-title').textContent=PC[pg];
  renderBank();
  document.getElementById('fab').className='fab'+((pg==='quests'||(pg==='rewards'&&rMode==='real'))?' show':'');

  const m=document.getElementById('main');
  if(pg==='dash')m.innerHTML=renderDash();
  else if(pg==='quests')m.innerHTML=renderQuests();
  else if(pg==='rewards')m.innerHTML=renderRewards();
  else if(pg==='calendar')m.innerHTML=renderCalendar();
  else if(pg==='logs')m.innerHTML=renderLogs();
  else if(pg==='settings')m.innerHTML=renderSettings();
}

/* ══ PWA ══ */
(function(){
  function _genIcon(size){
    const c=document.createElement('canvas');c.width=size;c.height=size;
    const ctx=c.getContext('2d');
    ctx.fillStyle='#101014';ctx.fillRect(0,0,size,size);
    ctx.beginPath();ctx.arc(size/2,size/2,size*.46,0,Math.PI*2);
    const g=ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size*.46);
    g.addColorStop(0,'#1e3a8a');g.addColorStop(1,'#1d4ed8');ctx.fillStyle=g;ctx.fill();
    ctx.font=`bold ${size*.45}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('⚡',size/2,size*.52);return c.toDataURL('image/png');
  }
  const manifest={name:'Dopamin Quest',short_name:'DQ',description:'자기계발 RPG 보상 시스템',start_url:'./',display:'standalone',background_color:'#101014',theme_color:'#101014',orientation:'portrait',icons:[{src:_genIcon(192),sizes:'192x192',type:'image/png',purpose:'any maskable'},{src:_genIcon(512),sizes:'512x512',type:'image/png',purpose:'any maskable'}]};
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  document.getElementById('pwa-manifest').href=URL.createObjectURL(blob);
  document.getElementById('pwa-icon').href=_genIcon(180);
  if('serviceWorker' in navigator){
    const sw=`const CACHE='dq-v3';self.addEventListener('install',e=>{e.waitUntil(caches.open(CACHE).then(c=>c.addAll(['./', './index.html'])))});self.addEventListener('fetch',e=>{e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request).catch(()=>caches.match('./index.html'))))});self.addEventListener('activate',e=>{e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE).map(k=>caches.delete(k)))))});`;
    navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw],{type:'application/javascript'})),{scope:'./'}).catch(()=>{});
  }
  const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const isStandalone=window.navigator.standalone===true||window.matchMedia('(display-mode:standalone)').matches;
  if(!isStandalone&&!localStorage.getItem('pwa_dismissed')){
    setTimeout(()=>{
      const banner=document.createElement('div');banner.className='pwa-banner';banner.id='pwa-banner';
      banner.innerHTML=`<div class="pwa-banner-ico">📱</div><div class="pwa-banner-body"><div class="pwa-banner-title">홈 화면에 추가하기</div><div class="pwa-banner-sub">앱처럼 설치해서 더 편하게 사용하세요</div></div><button class="pwa-banner-close" onclick="toggleInstallSteps()">❓</button><button class="pwa-banner-close" onclick="dismissBanner()">✕</button>`;
      document.body.appendChild(banner);
      if(isIOS){
        const steps=document.createElement('div');steps.className='pwa-install-steps';steps.id='pwa-steps';
        steps.innerHTML=`<div style="font-size:13px;font-weight:700;color:var(--t1);margin-bottom:10px">📱 아이폰 설치 방법</div><div class="pwa-step"><div class="pwa-step-num">1</div><div>Safari 하단 <b style="color:var(--t1)">공유 버튼 🔗</b> 탭</div></div><div class="pwa-step"><div class="pwa-step-num">2</div><div><b style="color:var(--t1)">"홈 화면에 추가"</b> 선택</div></div><div class="pwa-step"><div class="pwa-step-num">3</div><div><b style="color:var(--t1)">"추가"</b> 탭 → 완료!</div></div>`;
        document.body.insertBefore(steps,banner);
      }
    },2000);
  }
  window.toggleInstallSteps=()=>document.getElementById('pwa-steps')?.classList.toggle('show');
  window.dismissBanner=()=>{['pwa-banner','pwa-steps'].forEach(id=>document.getElementById(id)?.remove());localStorage.setItem('pwa_dismissed','1')};
})();

render();
setInterval(()=>{checkScheduled();renderBank();},60000);
</script>
