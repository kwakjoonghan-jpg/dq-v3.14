<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>Dopamin Quest</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DQ">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#101014">
<link rel="manifest" id="pwa-manifest">
<link rel="apple-touch-icon" id="pwa-icon">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#101014;--bg2:#18181f;--card:#1e1e27;--card2:#26262f;
  --line:#2a2a35;--line2:#33333f;
  --t1:#f4f4f6;--t2:#9999aa;--t3:#555566;
  --blue:#3b82f6;--blue-bg:rgba(59,130,246,0.12);
  --green:#00c471;--green-bg:rgba(0,196,113,0.12);
  --red:#ff4e4e;--red-bg:rgba(255,78,78,0.12);
  --yellow:#f5a623;--yellow-bg:rgba(245,166,35,0.12);
  --purple:#8b5cf6;--purple-bg:rgba(139,92,246,0.12);
  --r:16px;--r-sm:10px;--r-xs:7px;
  --glow-S:rgba(255,78,78,0.5);--glow-A:rgba(245,166,35,0.5);
  --glow-B:rgba(59,130,246,0.5);--glow-C:rgba(0,196,113,0.4);
}
html,body{height:100%;background:var(--bg);color:var(--t1);font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo',sans-serif;overflow:hidden;font-size:15px}
#app{display:flex;flex-direction:column;height:100vh;max-width:480px;margin:0 auto}
.topbar{padding:16px 20px 0;flex-shrink:0}
.topbar-row{display:flex;align-items:center;justify-content:space-between}
.topbar-brand{font-size:13px;font-weight:700;color:var(--t3);letter-spacing:.1em;text-transform:uppercase}
.topbar-title{font-size:22px;font-weight:800;color:var(--t1);margin-top:3px;letter-spacing:-.5px}

/* 상단 설정 버튼 추가 스타일 */
.topbar-btn {
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  padding: 4px;
  margin-right: -4px;
  transition: transform 0.15s;
  line-height: 1;
}
.topbar-btn:active {
  transform: scale(0.9);
}

/* BANK */
.bank-card{margin:12px 20px 0;background:var(--blue);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.bank-card::before{content:'';position:absolute;top:-30px;right:-30px;width:130px;height:130px;background:rgba(255,255,255,.07);border-radius:50%}
.bank-card::after{content:'';position:absolute;bottom:-40px;right:20px;width:90px;height:90px;background:rgba(255,255,255,.05);border-radius:50%}
.bank-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:6px}
.bank-label{font-size:11px;font-weight:600;color:rgba(255,255,255,.65);letter-spacing:.06em;text-transform:uppercase;margin-bottom:4px}
.bank-amount{font-size:30px;font-weight:800;color:#fff;letter-spacing:-1px;line-height:1}
/* 레벨 배지 */
.level-badge{background:rgba(255,255,255,.15);border-radius:10px;padding:6px 10px;text-align:center;flex-shrink:0}
.level-num{font-size:10px;font-weight:700;color:rgba(255,255,255,.7);letter-spacing:.06em;text-transform:uppercase}
.level-emoji{font-size:20px;line-height:1;display:block;margin:2px 0}
.level-title{font-size:10px;font-weight:700;color:#fff;white-space:nowrap}
/* 레벨 프로그레스 */
.level-progress-wrap{margin-top:10px}
.level-progress-row{display:flex;justify-content:space-between;font-size:10px;color:rgba(255,255,255,.6);margin-bottom:4px}
.level-bar-track{height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.level-bar-fill{height:100%;background:rgba(255,255,255,.8);border-radius:2px;transition:width .6s ease}
.bank-status{display:inline-flex;align-items:center;gap:5px;margin-top:8px;font-size:11px;font-weight:600;color:rgba(255,255,255,.8);background:rgba(255,255,255,.15);padding:3px 9px;border-radius:20px}
.bank-stats-row{display:flex;gap:0;margin-top:12px;border-top:1px solid rgba(255,255,255,.12);padding-top:12px}
.bstat{flex:1;text-align:center}
.bstat+.bstat{border-left:1px solid rgba(255,255,255,.12)}
.bstat-val{font-size:13px;font-weight:700;color:#fff}
.bstat-lbl{font-size:10px;font-weight:500;color:rgba(255,255,255,.5);margin-top:1px}

/* 플로팅 */
.float-text{position:fixed;pointer-events:none;z-index:9998;font-size:18px;font-weight:800;animation:floatUp .9s ease-out forwards}
@keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-60px) scale(1.2)}}
/* SCROLL */
.scroll{flex:1;overflow-y:auto;padding:12px 20px 120px;scrollbar-width:none}
.scroll::-webkit-scrollbar{display:none}
.sec-head{display:flex;align-items:center;justify-content:space-between;margin:18px 0 9px}
.sec-title{font-size:13px;font-weight:700;color:var(--t2);letter-spacing:.04em}
.sec-more{font-size:12px;font-weight:600;color:var(--blue);background:none;border:none;cursor:pointer;font-family:inherit;padding:0}

/* QUEST CARD */
.qcard{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:8px;border:1px solid var(--line);cursor:pointer;transition:border-color .2s,box-shadow .2s;position:relative;overflow:hidden}
.qcard:active{background:var(--card2)}
.qcard.done{opacity:.4}
.qcard.diff-S{border-color:rgba(255,78,78,.4);box-shadow:0 0 12px var(--glow-S)}
.qcard.diff-A{border-color:rgba(245,166,35,.4);box-shadow:0 0 12px var(--glow-A)}
.qcard.diff-B{border-color:rgba(59,130,246,.35);box-shadow:0 0 10px var(--glow-B)}
.qcard.diff-C{border-color:rgba(0,196,113,.3);box-shadow:0 0 8px var(--glow-C)}
@keyframes cardFlash{0%{transform:scale(1);filter:brightness(1)}20%{transform:scale(1.03);filter:brightness(1.7)}60%{transform:scale(0.99);filter:brightness(1.2)}100%{transform:scale(1);filter:brightness(1)}}
.qcard.flash{animation:cardFlash .5s ease-out}
.qcard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:7px}
.qcard-title{font-size:14px;font-weight:700;color:var(--t1);line-height:1.35;flex:1}
.qcard-reward{font-size:14px;font-weight:800;color:var(--blue);white-space:nowrap}
.qcard-tags{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:9px}
.tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:5px}
.tag-cat{background:var(--card2);color:var(--t2)}
.tag-S{background:linear-gradient(135deg,rgba(255,78,78,.25),rgba(255,78,78,.12));color:#ff8080;border:1px solid rgba(255,78,78,.4);font-weight:800}
.tag-A{background:linear-gradient(135deg,rgba(245,166,35,.25),rgba(245,166,35,.12));color:#f5a623;border:1px solid rgba(245,166,35,.4);font-weight:800}
.tag-B{background:linear-gradient(135deg,rgba(59,130,246,.2),rgba(59,130,246,.08));color:#60a5fa;border:1px solid rgba(59,130,246,.35)}
.tag-C{background:linear-gradient(135deg,rgba(0,196,113,.2),rgba(0,196,113,.08));color:#34d399;border:1px solid rgba(0,196,113,.3)}
.tag-rep{background:var(--purple-bg);color:var(--purple)}
.tag-sin{background:var(--blue-bg);color:var(--blue)}
.tag-overdue{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,78,78,.3)}
.tag-due-soon{background:var(--yellow-bg);color:var(--yellow);border:1px solid rgba(245,166,35,.3)}
.qcard-story{font-size:11px;color:var(--t3);font-style:italic;margin-bottom:9px;padding:7px 9px;background:var(--bg2);border-radius:var(--r-xs);line-height:1.5}
.qcard-foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.qcard-meta{font-size:11px;color:var(--t3);line-height:1.7}
.qcard-meta b{color:var(--t2);font-weight:600}
.qcard-edit-hint{font-size:10px;color:var(--t3);text-align:right;margin-top:6px}

/* MAIN/SUB QUEST ACCORDION v1.4 */
.qcard.main-quest{border-color:rgba(96,165,250,.38);background:linear-gradient(180deg,#20202b,#171720);box-shadow:0 12px 30px rgba(0,0,0,.22)}
.qcard.main-quest.done{opacity:.78;border-color:rgba(0,196,113,.32)}
.main-quest-headline{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:900;color:#93c5fd;letter-spacing:.06em;text-transform:uppercase;margin-bottom:6px}
.main-progress-wrap{margin:11px 0 9px}
.main-progress-top{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--t2);font-weight:800;margin-bottom:5px}
.main-progress-track{height:6px;background:var(--line2);border-radius:999px;overflow:hidden}
.main-progress-fill{height:100%;background:linear-gradient(90deg,#60a5fa,#8b5cf6);border-radius:999px;transition:width .25s ease}
.main-next-step{background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:11px;color:var(--t2);line-height:1.45;margin:8px 0}
.main-next-step b{color:var(--t1)}
.main-accordion-btn{width:100%;justify-content:center;margin-top:7px;padding:10px 14px;font-size:13px;border-radius:12px}
.subquest-list{border-top:1px solid var(--line);margin:12px -14px -2px;padding:10px 14px 0}
.subquest-row{display:grid;grid-template-columns:18px 1fr auto;gap:8px;align-items:center;padding:8px 8px;border-radius:10px;cursor:pointer;transition:background .15s;margin-bottom:3px}
.subquest-row:hover{background:rgba(255,255,255,.04)}
.subquest-row.current{background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.18)}
.subquest-row.done{opacity:.62}.subquest-row.done .subquest-title{text-decoration:line-through}
.subquest-dot{width:9px;height:9px;border-radius:50%;background:#636579;box-shadow:0 0 0 3px rgba(255,255,255,.03)}
.subquest-row.done .subquest-dot{background:#64d982}.subquest-row.current .subquest-dot{background:#60a5fa}
.subquest-title{font-size:12px;font-weight:800;color:var(--t1);line-height:1.32;min-width:0}.subquest-parent{font-size:10px;color:#93c5fd;margin-top:2px}.subquest-meta{font-size:10px;color:var(--t3);margin-top:2px;line-height:1.35}
.subquest-reward{font-size:11px;font-weight:900;color:#77a2ff;white-space:nowrap;text-align:right}.subquest-reward.done{color:#6ee7b7}
.subquest-actions{display:flex;gap:7px;margin-top:10px}.subquest-actions .btn{flex:1;justify-content:center}
.subquest-bonus{border:1px solid rgba(139,92,246,.3);background:rgba(139,92,246,.10);border-radius:12px;padding:9px 10px;margin-top:8px;display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:900;color:#c4b5fd}
.main-mini-label{display:inline-flex;align-items:center;gap:4px;background:rgba(96,165,250,.12);border:1px solid rgba(96,165,250,.25);color:#93c5fd;border-radius:999px;padding:2px 7px;font-size:10px;font-weight:900}


/* ══ QUEST READABILITY v1.4.3 ══ */
.quest-summary-card{background:linear-gradient(135deg,rgba(59,130,246,.12),rgba(139,92,246,.08));border:1px solid rgba(96,165,250,.22);border-radius:16px;padding:11px 12px;margin-bottom:10px;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.10)}
.quest-summary-item{background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);border-radius:12px;padding:8px 4px;text-align:center;min-width:0}
.quest-summary-num{font-size:15px;font-weight:950;color:var(--t1);line-height:1}.quest-summary-lbl{font-size:9px;font-weight:850;color:var(--t3);margin-top:4px;white-space:nowrap}
.quest-summary-item.danger .quest-summary-num{color:#ff8080}.quest-summary-item.warn .quest-summary-num{color:#fbbf24}.quest-summary-item.main .quest-summary-num{color:#a78bfa}.quest-summary-item.rec .quest-summary-num{color:#60a5fa}
.quest-toolbar{display:flex;align-items:center;gap:7px;margin-bottom:11px}.quest-toolbar .btn{flex:1;justify-content:center;padding:9px 8px;border-radius:12px;font-size:11px}.quest-toolbar .btn.on{background:var(--blue-bg);color:var(--blue);border-color:rgba(59,130,246,.35)}
.quest-search-panel{display:none;margin-bottom:11px}.quest-search-panel.open{display:flex}.quest-section-title{font-size:11px;font-weight:950;color:var(--t2);letter-spacing:.04em;margin:15px 0 7px;display:flex;align-items:center;justify-content:space-between}.quest-section-count{font-size:10px;color:var(--t3);font-weight:800}
.qcard-compact{padding:12px 13px;border-radius:15px}.qcard-compact .qcard-head{margin-bottom:5px}.qcard-compact .qcard-title{font-size:14px;font-weight:850}.qcard-compact .qcard-reward{font-size:13px;color:#93c5fd}.qcard-compact .qcard-tags{margin-bottom:8px}.qcard-compact .tag{font-size:9px;padding:2px 6px}.qcard-compact .qcard-foot{border-top:1px solid rgba(255,255,255,.045);padding-top:8px;margin-top:4px}.qcard-compact .qcard-meta{font-size:10px;color:var(--t3)}
.quest-quick-line{font-size:11px;color:var(--t2);line-height:1.45;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;padding:7px 9px;margin-top:7px}.quest-quick-line b{color:var(--t1)}
.qcard-actions{display:flex;align-items:center;gap:7px}.qcard-more{width:31px;height:31px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--t2);font-weight:900;cursor:pointer}
.main-next-step.v143{display:flex;align-items:center;justify-content:space-between;gap:9px}.main-next-step.v143 .next-copy{min-width:0}.main-next-step.v143 .btn{flex-shrink:0}.subquest-list.timeline{position:relative}.subquest-list.timeline::before{content:'';position:absolute;left:22px;top:20px;bottom:56px;width:2px;background:rgba(255,255,255,.07)}.subquest-row{position:relative}.subquest-row.done{opacity:.58}.subquest-row.done .subquest-title{text-decoration:line-through;color:var(--t3)}.subquest-row.current{background:rgba(96,165,250,.13)!important;border:1px solid rgba(96,165,250,.28)}.subquest-row.overdue{background:rgba(255,78,78,.08);border:1px solid rgba(255,78,78,.18)}.subquest-row.current .subquest-title{color:#dbeafe}.subquest-row.overdue .subquest-dot{background:var(--red)}
.quest-filter-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:14px}.quest-filter-grid .btn{justify-content:center}.quest-filter-grid .btn.on{background:var(--blue-bg);color:var(--blue);border-color:rgba(59,130,246,.38)}.quest-view-toggle{display:flex;gap:7px;margin-top:8px}.quest-view-toggle .btn{flex:1;justify-content:center}
.quest-rec-intro{font-size:12px;color:var(--t2);line-height:1.6;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:11px 12px;margin-bottom:10px}.quest-rec-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:13px;margin-bottom:9px;position:relative;overflow:hidden}.quest-rec-card::after{content:'';position:absolute;right:-30px;top:-30px;width:100px;height:100px;background:var(--pbg,rgba(59,130,246,.12));border-radius:50%;pointer-events:none}.quest-rec-head,.quest-rec-title,.quest-rec-meta,.quest-rec-reason,.quest-rec-actions{position:relative;z-index:1}.quest-rec-head{display:flex;justify-content:space-between;gap:8px;font-size:10px;font-weight:900;color:var(--t3);margin-bottom:6px}.quest-rec-rank{color:#60a5fa}.quest-rec-title{font-size:14px;font-weight:950;color:var(--t1);line-height:1.35}.quest-rec-meta{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}.quest-rec-meta span{font-size:10px;color:var(--t2);background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:999px;padding:2px 7px}.quest-rec-reason{font-size:11px;color:var(--t2);line-height:1.5;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);border-radius:10px;padding:7px 9px;margin-top:8px}.quest-rec-actions{display:flex;gap:7px;margin-top:10px;flex-wrap:wrap}.quest-rec-actions .btn{flex:1;justify-content:center;min-width:92px}
@media (max-width:360px){.quest-summary-card{grid-template-columns:repeat(2,1fr)}.quest-toolbar{display:grid;grid-template-columns:1fr 1fr}.quest-toolbar .btn{width:100%}.qcard-actions{flex-direction:column;align-items:stretch}.qcard-actions .btn,.qcard-more{width:100%;justify-content:center}}

/* 오늘의 퀘스트 */
.today-card{background:linear-gradient(135deg,#1a1f35,#1e2438);border:1px solid rgba(59,130,246,.35);border-radius:var(--r);padding:13px;margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden}
.today-card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--blue),var(--purple))}
.today-badge{display:inline-flex;align-items:center;gap:4px;background:var(--blue-bg);color:var(--blue);font-size:10px;font-weight:700;padding:2px 7px;border-radius:9px;margin-bottom:7px;border:1px solid rgba(59,130,246,.25)}
/* BTNS */
.btn{border:none;border-radius:var(--r-sm);padding:8px 14px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-blue{background:var(--blue);color:#fff}
.btn-purple{background:var(--purple-bg);color:var(--purple);border:1px solid rgba(139,92,246,.2)}
.btn-ghost{background:var(--card2);color:var(--t2);border:1px solid var(--line2)}
.btn-disabled{background:var(--card2);color:var(--t3);cursor:not-allowed}
.btn-red{background:var(--red-bg);color:var(--red);border:1px solid rgba(255,78,78,.2)}
.btn-sm{padding:6px 11px;font-size:11px}
/* 검색 */
.search-bar{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.search-input{flex:1;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--t1);padding:9px 12px;font-size:13px;outline:none;font-family:inherit}
.search-input:focus{border-color:var(--blue)}
.sort-select{background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--t2);padding:9px 10px;font-size:12px;outline:none;font-family:inherit;cursor:pointer}
/* REWARD */
.rcard{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:8px;border:1px solid var(--line);cursor:pointer;transition:border-color .2s,box-shadow .2s}
.rcard.rank-glow-S{border-color:rgba(255,78,78,.4);box-shadow:0 0 14px var(--glow-S)}
.rcard.rank-glow-A{border-color:rgba(245,166,35,.4);box-shadow:0 0 12px var(--glow-A)}
.rcard.rank-glow-B{border-color:rgba(59,130,246,.35);box-shadow:0 0 10px var(--glow-B)}
.rcard.rank-glow-C{border-color:rgba(0,196,113,.3);box-shadow:0 0 8px var(--glow-C)}
@keyframes unlockPulse{0%{box-shadow:0 0 0 0 rgba(0,196,113,.6)}50%{box-shadow:0 0 0 8px rgba(0,196,113,0)}100%{box-shadow:0 0 0 0 rgba(0,196,113,0)}}
.rcard.newly-unlocked{animation:unlockPulse 1s ease-out 2}
.rcard-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:6px}
.rcard-title{font-size:14px;font-weight:700;color:var(--t1)}
.rank-tag{font-size:10px;font-weight:800;padding:2px 8px;border-radius:5px;letter-spacing:.04em}
.rank-S{background:linear-gradient(135deg,rgba(255,78,78,.3),rgba(255,78,78,.15));color:#ff8080;border:1px solid rgba(255,78,78,.45)}
.rank-A{background:linear-gradient(135deg,rgba(245,166,35,.3),rgba(245,166,35,.15));color:#f5a623;border:1px solid rgba(245,166,35,.45)}
.rank-B{background:linear-gradient(135deg,rgba(59,130,246,.25),rgba(59,130,246,.1));color:#60a5fa;border:1px solid rgba(59,130,246,.4)}
.rank-C{background:linear-gradient(135deg,rgba(0,196,113,.25),rgba(0,196,113,.1));color:#34d399;border:1px solid rgba(0,196,113,.35)}
.rcard-cost{font-size:18px;font-weight:800;color:var(--t1);margin-bottom:5px}
.rcard-desc{font-size:12px;color:var(--t2);margin-bottom:3px}
.rcard-rules{font-size:11px;color:var(--t3);margin-bottom:8px}
.rcard-stats{font-size:11px;color:var(--t3);margin-bottom:8px}
.insuf{font-size:11px;color:var(--red);margin-top:5px;display:flex;align-items:center;gap:4px}
.market-section-label{font-size:12px;font-weight:700;padding:5px 11px;border-radius:7px;margin:12px 0 7px;display:inline-flex;align-items:center;gap:6px}
/* REWARD FILTER v1.5: 금액대·검색·자동등급 */
.reward-filter-card{background:linear-gradient(180deg,#20202b,#171720);border:1px solid rgba(96,165,250,.18);border-radius:18px;padding:12px;margin:0 0 12px;box-shadow:0 8px 24px rgba(0,0,0,.12)}
.reward-filter-top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}.reward-filter-title{font-size:12px;font-weight:950;color:var(--t2);letter-spacing:.04em}.reward-filter-count{font-size:11px;font-weight:900;color:#93c5fd;background:rgba(59,130,246,.11);border:1px solid rgba(59,130,246,.22);border-radius:999px;padding:3px 8px;white-space:nowrap}
.reward-filter-grid{display:grid;grid-template-columns:1.25fr .75fr .75fr;gap:7px;margin-bottom:8px}.reward-filter-grid .search-input{margin:0}.reward-filter-grid .form-input{padding:9px 10px;font-size:12px}
.reward-chip-row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.reward-chip-row::-webkit-scrollbar{display:none}.reward-chip{border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--t2);border-radius:999px;padding:6px 9px;font-size:10px;font-weight:900;white-space:nowrap;font-family:inherit;cursor:pointer}.reward-chip.on{background:var(--blue-bg);border-color:rgba(59,130,246,.4);color:#60a5fa}
.reward-filter-actions{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.reward-filter-actions .btn{justify-content:center}.reward-sort-select{width:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--t2);padding:9px 10px;font-size:12px;outline:none;font-family:inherit}
.reward-summary-card{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}.reward-summary-item{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:9px 4px;text-align:center}.reward-summary-num{font-size:14px;font-weight:950;color:var(--t1)}.reward-summary-lbl{font-size:9px;font-weight:850;color:var(--t3);margin-top:3px;white-space:nowrap}.reward-summary-item.s .reward-summary-num{color:#ff8080}.reward-summary-item.a .reward-summary-num{color:#f5a623}.reward-summary-item.b .reward-summary-num{color:#60a5fa}.reward-summary-item.c .reward-summary-num{color:#34d399}
.reward-section-title{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:14px 0 7px;font-size:12px;font-weight:950;color:var(--t2);letter-spacing:.02em}.reward-section-title span:last-child{font-size:10px;color:var(--t3)}
.rcard.compact-reward{padding:12px 13px}.rcard.compact-reward .rcard-head{margin-bottom:5px}.rcard.compact-reward .rcard-title{font-size:14px;font-weight:850;line-height:1.35}.rcard.compact-reward .rcard-cost{font-size:17px;margin-bottom:4px}.rcard.compact-reward .rcard-desc{font-size:11px;line-height:1.45}.reward-meta-line{display:flex;gap:5px;flex-wrap:wrap;margin:7px 0}.reward-meta-line span{font-size:10px;color:var(--t2);background:rgba(255,255,255,.045);border:1px solid var(--line);border-radius:999px;padding:2px 7px}.rank-auto-note{font-size:10px;color:var(--t3);margin-top:4px;line-height:1.45}
@media (max-width:360px){.reward-filter-grid{grid-template-columns:1fr 1fr}.reward-filter-grid .search-input{grid-column:1/3}.reward-summary-card{grid-template-columns:repeat(2,1fr)}}

.ms-buyable{background:var(--green-bg);color:var(--green)}
.ms-almost{background:var(--yellow-bg);color:var(--yellow)}
.ms-goal{background:var(--card2);color:var(--t3)}
.almost-gap{font-size:18px;font-weight:800;color:var(--yellow);margin-bottom:3px}
/* LOG */
.log-card{background:var(--card);border-radius:var(--r);padding:4px 16px;margin-bottom:8px;border:1px solid var(--line)}
.log-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.log-row:last-child{border-bottom:none}
.log-ico{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.log-ico-earn{background:var(--green-bg)}
.log-ico-spend{background:var(--red-bg)}
.log-body{flex:1;min-width:0}
.log-name{font-size:13px;font-weight:600;color:var(--t1);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.log-time{font-size:11px;color:var(--t3);margin-top:1px}
.log-memo-txt{font-size:11px;color:var(--purple);margin-top:2px;font-style:italic}
.log-memo-btn{background:none;border:none;font-size:11px;color:var(--t3);cursor:pointer;padding:0;font-family:inherit;text-decoration:underline;margin-top:2px;display:inline-block}
.log-amt{font-size:13px;font-weight:800;flex-shrink:0}
.log-earn{color:var(--green)}
.log-spend{color:var(--red)}
/* STAT */
.stat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.stat-card{background:var(--card);border-radius:var(--r);padding:14px;border:1px solid var(--line);text-align:center;}
.stat-num{font-size:16px;font-weight:800;color:var(--t1);letter-spacing:-.3px}
.stat-lbl{font-size:11px;color:var(--t3);margin-bottom:4px;font-weight:600}
.bar-list{background:var(--card);border-radius:var(--r);padding:12px 14px;border:1px solid var(--line);margin-bottom:8px}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px}
.bar-row:last-child{margin-bottom:0}
.bar-lbl{font-size:12px;color:var(--t2);width:80px;text-align:right;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500}
.bar-track{flex:1;height:5px;background:var(--line2);border-radius:3px;overflow:hidden}
.bar-fill{height:100%;background:var(--blue);border-radius:3px}
.bar-val{font-size:11px;color:var(--t2);width:58px;text-align:right;font-weight:600}
.top-list{background:var(--card);border-radius:var(--r);padding:4px 14px;border:1px solid var(--line)}
/* ── 캘린더 ── */
.cal-wrap{background:var(--card);border-radius:var(--r);border:1px solid var(--line);overflow:hidden;margin-bottom:10px}
.cal-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px}
.cal-month{font-size:15px;font-weight:800;color:var(--t1)}
.cal-nav{background:none;border:none;color:var(--t2);font-size:18px;cursor:pointer;padding:4px 8px;border-radius:6px}
.cal-nav:hover{background:var(--card2);color:var(--t1)}
.cal-dow{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;padding:0 8px 6px}
.cal-dow-cell{font-size:10px;font-weight:700;color:var(--t3);padding:3px 0}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:0 8px 12px}
.cal-cell{min-height:44px;padding:3px;border-radius:6px;position:relative;cursor:pointer;transition:background .15s}
.cal-cell:hover{background:var(--card2)}
.cal-cell.other-month{opacity:.3}
.cal-date{font-size:11px;font-weight:600;color:var(--t2);text-align:center;margin-bottom:2px}
.cal-cell.today .cal-date{background:var(--blue);color:#fff;border-radius:50%;width:20px;height:20px;display:flex;align-items:center;justify-content:center;margin:0 auto 2px}
.cal-dot-wrap{display:flex;flex-wrap:wrap;gap:1px;justify-content:center}
.cal-dot{width:5px;height:5px;border-radius:50%;flex-shrink:0}
.cal-dot-log{background:var(--green)}
.cal-dot-quest{background:var(--blue)}
.cal-dot-overdue{background:var(--red)}
/* 캘린더 기간 표시: 퀘스트별 컬러 라인 */
.cal-cell{overflow:hidden}
.cal-cell.deadline{border:1px solid var(--red);}
.cal-cell.selected{outline:1px solid rgba(255,255,255,.22);outline-offset:-1px;background:rgba(255,255,255,.04)}
.cal-range-stack{position:absolute;left:0;right:0;bottom:4px;display:flex;flex-direction:column;gap:2px;pointer-events:none;z-index:0}
.cal-range-bar{height:5px;opacity:.72;box-shadow:0 0 6px rgba(255,255,255,.08)}
.cal-range-bar.range-start{margin-left:7px;border-radius:5px 0 0 5px}
.cal-range-bar.range-mid{border-radius:0}
.cal-range-bar.range-end{margin-right:7px;border-radius:0 5px 5px 0}
.cal-range-bar.range-only{margin:0 7px;border-radius:5px}
.cal-more{font-size:9px;color:var(--t3);text-align:center;line-height:1;margin-top:-1px}
.cal-date,.cal-dot-wrap{position:relative;z-index:2}
/* 캘린더 범례 */
.cal-legend{display:flex;gap:12px;padding:0 16px 12px;flex-wrap:wrap}
.cal-legend-item{display:flex;align-items:center;gap:5px;font-size:10px;color:var(--t3)}
/* 퀘스트 목록 (캘린더 날짜 클릭 시) */
.cal-quest-list{background:var(--card2);border-radius:var(--r-sm);padding:10px 12px;margin-top:4px;border:1px solid var(--line2)}
.cal-quest-item{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.cal-quest-item:last-child{border-bottom:none}
.cal-quest-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.cal-quest-name{font-size:12px;font-weight:600;color:var(--t1);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal-quest-type{font-size:10px;color:var(--t3)}
/* 설정 */
.setting-item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.setting-item-left{flex:1}
.setting-item-title{font-size:14px;font-weight:700;color:var(--t1);margin-bottom:2px}
.setting-item-desc{font-size:11px;color:var(--t3)}
.data-info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:8px}
.data-info-row{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.data-info-row:last-child{border-bottom:none}
.data-info-label{font-size:13px;color:var(--t2)}
.data-info-value{font-size:13px;font-weight:700;color:var(--t1)}
/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:300;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--bg2);border:1px solid var(--line2);border-radius:24px 24px 0 0;padding:12px 20px 48px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto}
.modal-drag{width:36px;height:4px;background:var(--line2);border-radius:2px;margin:0 auto 18px}
.modal-title{font-size:17px;font-weight:800;color:var(--t1);margin-bottom:4px;letter-spacing:-.3px}
.modal-sub{font-size:13px;color:var(--t2);margin-bottom:18px;font-weight:500}
.form-group{margin-bottom:13px}
.form-label{font-size:12px;font-weight:700;color:var(--t2);margin-bottom:5px;display:block;letter-spacing:.04em}
.form-input,.form-select,.form-textarea{width:100%;background:var(--card);border:1px solid var(--line2);border-radius:var(--r-sm);color:var(--t1);padding:10px 12px;font-size:14px;outline:none;transition:border .15s;font-family:inherit;font-weight:500}
.form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--blue)}
.form-select option{background:var(--bg2)}
.form-textarea{resize:vertical;min-height:70px}
.form-tip{font-size:11px;color:var(--t3);margin-top:4px}
.g2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px;align-items:start}
.g2>*{min-width:0}
.date-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.date-grid .form-group{min-width:0}
.form-input[type="date"],.date-input{min-width:0;width:100%;height:48px;padding:10px 8px;font-size:13px;line-height:1.2;text-align:center;color-scheme:dark;-webkit-appearance:none;appearance:none}
.form-input[type="date"]::-webkit-date-and-time-value,.date-input::-webkit-date-and-time-value{min-height:1.2em;text-align:center;margin:0 auto;padding:0}
.form-input[type="date"]::-webkit-calendar-picker-indicator,.date-input::-webkit-calendar-picker-indicator{opacity:.7;margin-left:0}
@media (max-width:360px){.date-grid{gap:8px}.form-input[type="date"],.date-input{font-size:12px;padding-left:6px;padding-right:6px}}
.modal-btns{display:flex;gap:8px;margin-top:8px}
/* SUB TABS */
.sub-tabs{display:flex;gap:4px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.sub-tabs::-webkit-scrollbar{display:none}
.stab{background:var(--card2);border:1px solid var(--line);border-radius:var(--r-xs);color:var(--t3);padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;font-family:inherit;transition:all .15s}
.stab.on{background:var(--blue-bg);border-color:rgba(59,130,246,.3);color:var(--blue)}

/* ══ QUEST TAB COMPACT LAYOUT v1.4.1 ══ */
.quest-tabs-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.10);overflow:hidden}
.quest-tabs-primary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:8px}
.quest-tab-main{min-width:0;background:var(--card2);border:1px solid var(--line);border-radius:12px;color:var(--t3);padding:8px 4px;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit;transition:all .15s;display:flex;align-items:center;justify-content:center;gap:4px;white-space:nowrap}
.quest-tab-main.on{background:var(--blue-bg);border-color:rgba(59,130,246,.45);color:var(--blue);box-shadow:0 0 12px rgba(59,130,246,.12)}
.quest-tabs-secondary{display:grid;grid-template-columns:repeat(5,1fr);gap:5px}
.quest-tab-sub{min-width:0;background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:10px;color:var(--t3);padding:7px 3px;font-size:10px;font-weight:900;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;white-space:nowrap}
.quest-tab-sub.on{background:var(--purple-bg);border-color:rgba(139,92,246,.45);color:var(--purple);box-shadow:0 0 12px rgba(139,92,246,.10)}
@media (max-width:360px){.quest-tabs-primary{grid-template-columns:repeat(2,1fr)}.quest-tabs-secondary{grid-template-columns:repeat(3,1fr)}.quest-tab-main{font-size:11px;padding:8px 3px}.quest-tab-sub{font-size:10px}}


/* STYLE SHOP FILTER v1.2.6: 모바일에서 모든 페르소나 탭이 항상 보이도록 2단 필터 카드화 */
.style-filter-card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:0 8px 24px rgba(0,0,0,.08)}
.style-filter-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.style-filter-title{font-size:12px;font-weight:900;color:var(--t2);letter-spacing:.04em}
.style-filter-now{font-size:11px;font-weight:800;color:#fbbf24;background:rgba(245,166,35,.1);border:1px solid rgba(245,166,35,.22);border-radius:999px;padding:3px 8px;white-space:nowrap}
.style-filter-primary{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.style-filter-btn{background:var(--card2);border:1px solid var(--line);border-radius:10px;color:var(--t3);padding:8px 4px;font-size:11px;font-weight:900;cursor:pointer;font-family:inherit;transition:all .15s;text-align:center;min-width:0}
.style-filter-btn.on{background:var(--blue-bg);border-color:rgba(59,130,246,.38);color:var(--blue);box-shadow:0 0 12px rgba(59,130,246,.12)}
.style-filter-count{display:block;font-size:9px;font-weight:800;color:var(--t3);margin-top:2px;line-height:1}
.style-filter-btn.on .style-filter-count{color:var(--blue)}
.style-filter-cat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.style-cat-btn{background:rgba(255,255,255,.035);border:1px solid var(--line);border-radius:12px;padding:8px 4px;cursor:pointer;font-family:inherit;transition:all .15s;min-width:0;text-align:center;color:var(--t2)}
.style-cat-btn.on{border-color:rgba(139,92,246,.42);background:var(--purple-bg);box-shadow:0 0 12px rgba(139,92,246,.12);color:var(--purple)}
.style-cat-emoji{font-size:18px;line-height:1;margin-bottom:4px}
.style-cat-name{font-size:10px;font-weight:900;line-height:1.12;white-space:normal;word-break:keep-all;min-height:22px;display:flex;align-items:center;justify-content:center}
.style-cat-count{font-size:9px;font-weight:800;color:var(--t3);margin-top:3px}
.style-cat-btn.on .style-cat-count{color:var(--purple)}
.style-filter-tip{font-size:10px;color:var(--t3);line-height:1.45;margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}
@media (max-width:360px){.style-filter-primary{grid-template-columns:repeat(2,1fr)}.style-filter-cat-grid{grid-template-columns:repeat(2,1fr)}}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:rgba(16,16,20,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--line);padding:9px 4px 30px;display:flex;justify-content:space-around;z-index:100}
.bnav-btn{background:none;border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--t3);font-family:inherit;transition:color .15s;padding:4px 8px;border-radius:var(--r-sm)}
.bnav-btn .ico{font-size:20px;line-height:1}
.bnav-btn .lbl{font-size:10px;font-weight:700;letter-spacing:.02em}
.bnav-btn.on{color:var(--blue)}
.fab{position:fixed;bottom:86px;right:max(20px,calc(50vw - 220px));background:var(--blue);color:#fff;border:none;border-radius:50%;width:50px;height:50px;font-size:22px;cursor:pointer;display:none;align-items:center;justify-content:center;box-shadow:0 4px 24px rgba(59,130,246,.4);transition:all .2s;z-index:99;font-family:inherit;line-height:1}
.fab:active{transform:scale(.95)}
.fab.show{display:flex}
/* TOAST */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-60px);background:var(--card2);color:var(--t1);border:1px solid var(--line2);padding:10px 18px;border-radius:28px;font-size:13px;font-weight:600;z-index:999;pointer-events:none;opacity:0;transition:all .3s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.unlock-toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-40px) scale(0.9);background:linear-gradient(135deg,#064e3b,#065f46);color:#6ee7b7;border:1px solid rgba(0,196,113,.5);padding:11px 18px;border-radius:13px;font-size:13px;font-weight:700;z-index:998;pointer-events:none;opacity:0;transition:all .4s cubic-bezier(0.34,1.56,0.64,1);white-space:nowrap;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,196,113,.3)}
.unlock-toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.unlock-badge{display:inline-flex;align-items:center;gap:3px;background:var(--green-bg);color:var(--green);border:1px solid rgba(0,196,113,.3);font-size:10px;font-weight:700;padding:2px 6px;border-radius:8px;margin-left:4px}
/* EMPTY */
.empty{text-align:center;padding:32px 20px}
.empty-ico{font-size:32px;margin-bottom:8px}
.empty-txt{font-size:13px;color:var(--t3);line-height:1.6;font-weight:500}
/* EMOJI */
.emoji-picker{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:5px}
.emoji-cat{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 3px;cursor:pointer;transition:all .15s}
.emoji-cat:hover,.emoji-cat.sel{border-color:var(--blue);background:var(--blue-bg)}
.emoji-cat .ec-ico{font-size:19px;line-height:1}
.emoji-cat .ec-lbl{font-size:9px;color:var(--t3);font-weight:600;text-align:center}
.emoji-cat.sel .ec-lbl{color:var(--blue)}
.emoji-chips{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.emoji-chip{font-size:17px;padding:4px 8px;background:var(--card2);border:1px solid var(--line);border-radius:var(--r-xs);cursor:pointer;transition:all .12s;line-height:1}

/* PWA */

<script>
/* ══ 카테고리 마이그레이션 ══ */
const CAT_MIG={'body':'몸','mind':'마음','skill':'스킬','work_project':'일/프로젝트','money_asset':'자산/돈','life_environment':'생활/환경'};
function migrateCat(c){return CAT_MIG[c]||c}

/* ══ 1~100 레벨 시스템 (곡선 설계 적용) ══ */
function getLevel(totalEarned){
  const MAX_EARN = 100000000; // 1억원
  const MAX_LV = 100;
  
  let lv = Math.floor(1 + 99 * Math.pow(Math.min(totalEarned, MAX_EARN) / MAX_EARN, 0.5));
  if(lv > MAX_LV) lv = MAX_LV;
  
  const getReq = (l) => l <= 1 ? 0 : Math.floor(MAX_EARN * Math.pow((l - 1) / 99, 2));
  
  const curReq = getReq(lv);
  const nextReq = getReq(lv + 1);
  
  let pct = 100;
  let nextObj = null;
  if (lv < MAX_LV) {
    pct = Math.max(0, Math.min(100, ((totalEarned - curReq) / (nextReq - curReq)) * 100)).toFixed(1);
    nextObj = { level: lv + 1 };
  }

  let title = "신화적 존재", emoji = "🐉";
  if (lv < 10) { title = "퀘스트 입문자"; emoji = "🌱"; }
  else if (lv < 20) { title = "견습 모험가"; emoji = "⚔️"; }
  else if (lv < 30) { title = "성장하는 전사"; emoji = "🛡️"; }
  else if (lv < 40) { title = "숙련된 탐험가"; emoji = "🐎"; }
  else if (lv < 50) { title = "베테랑 퀘스터"; emoji = "🗺️"; }
  else if (lv < 60) { title = "엘리트 모험가"; emoji = "💎"; }
  else if (lv < 70) { title = "마스터 클래스"; emoji = "🦅"; }
  else if (lv < 80) { title = "챔피언 퀘스터"; emoji = "🏆"; }
  else if (lv < 90) { title = "그랜드 마스터"; emoji = "👑"; }
  else if (lv < 100) { title = "전설의 영웅"; emoji = "🌟"; }

  return { level: lv, title, emoji, pct, next: nextObj, curReq, nextReq, totalEarned };
}

function _normRewardTitleForWishlist(s){return String(s||'').toLowerCase().replace(/[^0-9a-zA-Z가-힣]+/g,'')}
function mergeWishlistRewards(list){
  const base=Array.isArray(list)?list:[];
  let changed=false;
  WISHLIST_REWARDS.forEach(w=>{
    const wKey=_normRewardTitleForWishlist(w.title);
    let idx=base.findIndex(r=>r.id===w.id);
    if(idx<0)idx=base.findIndex(r=>_normRewardTitleForWishlist(r.title)===wKey);
    if(idx>=0){
      const old=base[idx]||{};
      base[idx]={...old,...w,id:old.id||w.id,isPurchased:old.isPurchased||false,totalPurchasedCount:Number(old.totalPurchasedCount||0),totalSpent:Number(old.totalSpent||0),createdAt:old.createdAt||w.createdAt};
    }else{
      base.push({...w});changed=true;
    }
  });
  if(changed)base.sort((a,b)=>(a.cost||0)-(b.cost||0));
  return base;
}

function questDueLabel(q){
  if(!q?.dueDate)return '기한 없음';
  const d=TODATE(q.dueDate);const diff=Math.round((d-TODAY)/(1000*60*60*24));
  if(diff<0)return `기한초과 D+${Math.abs(diff)}`;
  if(diff===0)return '오늘 마감';
  if(diff<=7)return `D-${diff}`;
  return FDate(q.dueDate);
}
function questStatusWeight(q){
  if(q.status==='진행중')return 0;
  if(q.status==='예정'&&q.startDate){const sd=TODATE(q.startDate);return sd>TODAY?30+Math.round((sd-TODAY)/(1000*60*60*24)):1}
  return 2;
}
function questDifficultyWeight(q){return{S:4,A:3,B:2,C:1}[q?.difficulty]||1}
function getSuggestedQuestForPersona(cat){
  const list=Q.filter(q=>migrateCat(q.category||'몸')===cat&&isRecommendableQuest(q));
  list.sort((a,b)=>{
    const aw=questStatusWeight(a),bw=questStatusWeight(b);if(aw!==bw)return aw-bw;
    const ad=a.dueDate?TODATE(a.dueDate).getTime():8640000000000000;
    const bd=b.dueDate?TODATE(b.dueDate).getTime():8640000000000000;
    if(ad!==bd)return ad-bd;
    return (b.reward||0)-(a.reward||0)||questDifficultyWeight(b)-questDifficultyWeight(a);
  });
  return list[0]||null;
}
function getRecommendedQuest(data){
  const ordered=[...PERSONA_ORDER].sort((a,b)=>personaSortWeak(a,b,data.stats));
  for(const c of ordered){
    const q=getSuggestedQuestForPersona(c);
    if(q){
      const isWeakest=c===data.weakest;
      const due=q.dueDate?TODATE(q.dueDate):null;
      let reason=isWeakest?'가장 낮은 페르소나를 끌어올리는 추천입니다.':'최저 분야에 바로 진행할 퀘스트가 없어 다음 약한 분야를 추천합니다.';
      if(due&&due<TODAY)reason='기한이 지난 퀘스트라 우선 정리가 필요합니다.';
      else if(due&&due.getTime()===TODAY.getTime())reason='오늘 마감이라 우선 처리 가치가 높습니다.';
      else if(q.status==='예정')reason='예정 퀘스트지만 이 분야에서 가장 가까운 성장 후보입니다.';
      return{cat:c,quest:q,reason,isWeakest};
    }
  }
  return{cat:data.weakest,quest:null,reason:'진행 가능한 퀘스트가 없습니다. 약한 분야에 새 퀘스트를 만들어 균형을 맞추는 것이 좋습니다.',isWeakest:true};
}

function getRecommendationReasonForQuest(q,cat,data){
  const isWeakest=cat===data.weakest;
  const due=q.dueDate?TODATE(q.dueDate):null;
  if(due&&due<TODAY)return '기한이 지난 퀘스트라 먼저 정리하면 흐름이 살아납니다.';
  if(due&&due.getTime()===TODAY.getTime())return '오늘 마감이라 지금 처리 우선순위가 가장 높습니다.';
  if(isWeakest)return '현재 가장 낮은 페르소나를 끌어올리는 균형 성장 추천입니다.';
  if(q.status==='예정')return '예정 퀘스트지만 이 분야에서 곧 성장으로 연결될 후보입니다.';
  return '약한 페르소나 순서로 뽑은 다음 성장 후보입니다.';
}
function getRecommendedQuestList(data,limit=12){
  data=data||buildPersonaStats();
  const ordered=[...PERSONA_ORDER].sort((a,b)=>personaSortWeak(a,b,data.stats));
  const picked=[],used=new Set();
  for(const cat of ordered){
    const qs=Q.filter(q=>migrateCat(q.category||'몸')===cat&&isRecommendableQuest(q));
    qs.sort((a,b)=>{
      const aw=questStatusWeight(a),bw=questStatusWeight(b);if(aw!==bw)return aw-bw;
      const ad=a.dueDate?TODATE(a.dueDate).getTime():8640000000000000;
      const bd=b.dueDate?TODATE(b.dueDate).getTime():8640000000000000;
      if(ad!==bd)return ad-bd;
      return questDifficultyWeight(b)-questDifficultyWeight(a)||(b.reward||0)-(a.reward||0);
    });
    for(const q of qs.slice(0,2)){
      if(used.has(q.id))continue;
      used.add(q.id);
      picked.push({cat,quest:q,reason:getRecommendationReasonForQuest(q,cat,data),isWeakest:cat===data.weakest});
      if(picked.length>=limit)return picked;
    }
  }
  return picked;
}

function isQuestCompletedOnDate(qid,date){return QL.some(l=>!l.isDailyRouteBonus&&l.questId===qid&&String(l.completedAt||'').slice(0,10)===date)}
function isQuestInTodayRoute(qid){P=normalizePersonaState(P);return P.dailyRoute?.date===TODAYSTR&&P.dailyRoute.questIds.includes(qid)}
function routeQuestPool(){return Q.filter(q=>q.status!=='완료'&&q.status!=='예정'&&!(isParentQuest(q)&&childQuests(q.id).some(s=>s.status!=='완료')))}
function buildDailyRouteIds(force=false){
  P=normalizePersonaState(P);
  const current=(P.dailyRoute&&P.dailyRoute.date===TODAYSTR)?P.dailyRoute.questIds.filter(id=>Q.some(q=>q.id===id)):[];
  if(!force&&current.length){return current}
  const data=buildPersonaStats();
  let recs=getRecommendedQuestList(data,18).filter(r=>r.quest&&r.quest.status!=='완료'&&r.quest.status!=='예정');
  recs=recs.filter(r=>!isQuestCompletedOnDate(r.quest.id,TODAYSTR));
  const picked=[],usedCat=new Set(),usedId=new Set();
  for(const r of recs){
    if(picked.length>=3)break;
    if(usedId.has(r.quest.id))continue;
    if(usedCat.has(r.cat)&&picked.length<2)continue;
    picked.push(r.quest.id);usedCat.add(r.cat);usedId.add(r.quest.id);
  }
  if(picked.length<3){
    for(const r of recs){
      if(picked.length>=3)break;
      if(!usedId.has(r.quest.id)){picked.push(r.quest.id);usedId.add(r.quest.id)}
    }
  }
  if(picked.length<3){
    const fallback=routeQuestPool().filter(q=>!usedId.has(q.id)&&!isQuestCompletedOnDate(q.id,TODAYSTR));
    fallback.sort((a,b)=>questStatusWeight(a)-questStatusWeight(b)||(b.reward||0)-(a.reward||0));
    for(const q of fallback){if(picked.length>=3)break;picked.push(q.id);usedId.add(q.id)}
  }
  P.dailyRoute={date:TODAYSTR,questIds:picked,generatedAt:new Date().toISOString(),source:force?'manual':'auto',completedDate:'',completedAt:'',bonusMoney:0,bonusCoins:0};
  sv(SK.P,P);
  return picked;
}
function getDailyRouteQuests(force=false){const ids=buildDailyRouteIds(force);return ids.map(id=>Q.find(q=>q.id===id)).filter(Boolean)}
function rerollDailyRoute(){
  if(!confirm('오늘의 성장 루트를 다시 뽑을까요?\n이미 완료한 퀘스트는 유지되고, 아직 안 한 후보 위주로 다시 추천됩니다.'))return;
  getDailyRouteQuests(true);toast('🧭 오늘의 성장 루트를 다시 짰어요!');render();
}
function dailyRouteProgress(qs){const done=qs.filter(q=>isQuestCompletedOnDate(q.id,TODAYSTR)||q.status==='완료').length;return{done,total:qs.length,pct:qs.length?Math.round(done/qs.length*100):0}}
function routeReason(q){
  const data=buildPersonaStats();const cat=migrateCat(q.category||'몸');const due=q.dueDate?TODATE(q.dueDate):null;
  const parent=questParent(q);if(parent)return `메인 퀘스트 「${parent.title}」의 다음 스텝으로 장기 목표를 밀어주는 루트입니다.`;
  if(due&&due<TODAY)return '기한 초과 퀘스트라 먼저 정리하면 대시보드 부담이 줄어듭니다.';
  if(due&&due.getTime()===TODAY.getTime())return '오늘 마감 퀘스트라 오늘 루트에 우선 배치했습니다.';
  if(cat===data.weakest)return '현재 가장 낮은 페르소나를 끌어올리는 핵심 루트입니다.';
  const st=data.stats[cat];
  if(st&&!st.lastAt)return '아직 성장 기록이 약한 분야라 첫 기록 보너스를 노릴 수 있습니다.';
  return '균형 성장과 보상 효율을 함께 고려해 오늘 후보로 뽑았습니다.';
}
function dailyRouteBonus(qs){
  const totalReward=qs.reduce((s,q)=>s+Number(q.reward||0),0);
  const cats=[...new Set(qs.map(q=>migrateCat(q.category||'몸')))];
  const diffScore=qs.reduce((s,q)=>s+questDifficultyWeight(q),0);
  const money=Math.max(10000,Math.round((totalReward*0.08+cats.length*5000+diffScore*2500)/1000)*1000);
  const coins=Math.max(12,Math.round(qs.length*8+cats.length*5+diffScore*2));
  return{money,coins,totalReward,cats};
}
function hasDailyRouteCompletion(date=TODAYSTR){P=normalizePersonaState(P);return P.dailyRoute.completedDate===date||(P.dailyRouteHistory||[]).some(h=>h.date===date)}
function mainRoutePersona(qs){

  return Object.keys(counts).sort((a,b)=>counts[b]-counts[a]||PERSONA_ORDER.indexOf(a)-PERSONA_ORDER.indexOf(b))[0]||buildPersonaStats().representative;
}

  P.dailyRoute.completedDate=TODAYSTR;P.dailyRoute.completedAt=completedAt;P.dailyRoute.bonusMoney=bonus.money;P.dailyRoute.bonusCoins=bonus.coins;
  const history={id:uid(),date:TODAYSTR,completedAt,questIds:qs.map(q=>q.id),questTitles:qs.map(q=>q.title),cats:bonus.cats,mainCat,bonusMoney:bonus.money,bonusCoins:bonus.coins,totalReward:bonus.totalReward,source:P.dailyRoute.source||'auto'};
  P.dailyRouteHistory=[history,...(P.dailyRouteHistory||[]).filter(h=>h.date!==TODAYSTR)].slice(0,120);

function normalizeQuestHierarchy(){

  (Q||[]).forEach((q,idx)=>{

    if(q.parentId&&!ids.has(q.parentId)){q.parentId='';changed=true}

    if(q.subOrder===undefined||q.subOrder===null||isNaN(Number(q.subOrder))){q.subOrder=0;changed=true}

/* ══ MYROUTINE → DQ GIST BRIDGE v1.0 ══ */
function routineTransferStatusWeight(s){
  return s==='applied'?4:s==='pending'?3:s==='failed'?2:1;
}
function normalizeRoutineTransfers(list){
  const arr=Array.isArray(list)?list:[];
  const appliedIds=new Set((Array.isArray(QL)?QL:[]).filter(l=>l&&l.routineTransferId).map(l=>l.routineTransferId));
  return arr.filter(t=>t&&t.id).map(t=>{
    const amount=Number(t.amount||0);
    const copied={...t,amount};
    if(appliedIds.has(copied.id)){
      copied.status='applied';
      copied.appliedLogId=copied.appliedLogId||(QL.find(l=>l.routineTransferId===copied.id)?.id||'');
    }else{
      copied.status=copied.status||'pending';
    }
    return copied;
  }).sort((a,b)=>new Date(b.createdAt||b.appliedAt||0)-new Date(a.createdAt||a.appliedAt||0));
}
function mergeRoutineTransfers(){
  const map={};
  Array.from(arguments).flat().forEach(t=>{
    if(!t||!t.id)return;
    const cur=map[t.id];
    if(!cur){map[t.id]={...t};return;}
    const curW=routineTransferStatusWeight(cur.status);
    const nextW=routineTransferStatusWeight(t.status);
    map[t.id]=nextW>curW?{...cur,...t}:{...t,...cur};
  });
  return normalizeRoutineTransfers(Object.values(map));
}
function routineTransferSummary(){
  const arr=normalizeRoutineTransfers(RT);
  const pending=arr.filter(t=>t.status==='pending').length;
  const applied=arr.filter(t=>t.status==='applied').length;
  const pendingAmount=arr.filter(t=>t.status==='pending').reduce((s,t)=>s+Number(t.amount||0),0);
  const appliedAmount=arr.filter(t=>t.status==='applied').reduce((s,t)=>s+Number(t.amount||0),0);
  return{total:arr.length,pending,applied,pendingAmount,appliedAmount};
}
function makeDQBackupData(extra={}){
  RT=normalizeRoutineTransfers(RT);
  return {...extra,quests:Q,questLogs:QL,rewards:R,purchaseLogs:PL,persona:P,routineTransfers:RT,exportedAt:new Date().toISOString(),bridgeVersion:'dqloop-dq-v1'};
}
async function readDQGistBackup(){
  const res=await fetch(`https://api.github.com/gists/${gistID}`,{headers:{'Authorization':`token ${githubPAT}`,'Accept':'application/vnd.github.v3+json'}});
  if(!res.ok)throw new Error('Gist 정보를 불러올 수 없습니다.');
  const gist=await res.json();
  const file=gist.files&&gist.files["dq-backup.json"];
  let backup={};
  if(file&&file.content){
    try{backup=JSON.parse(file.content)||{};}catch{backup={};}
  }
  return{gist,backup};
}
async function writeDQGistBackup(data){
  const body={files:{"dq-backup.json":{content:JSON.stringify(data,null,2)}}};
  const res=await fetch(`https://api.github.com/gists/${gistID}`,{
    method:'PATCH',
    headers:{'Authorization':`token ${githubPAT}`,'Accept':'application/vnd.github.v3+json'},
    body:JSON.stringify(body)
  });
  if(!res.ok)throw new Error('Gist 저장에 실패했습니다.');
  return await res.json();
}
function makeRoutineTransferLog(t){
  const days=Array.isArray(t.rewardedDays)?t.rewardedDays:[];
  const dateText=days.length?`대상일: ${days.join(', ')}`:'대상일 정보 없음';
  const memo=[t.memo||'DQ Loop 루틴 잔고 이체',dateText].filter(Boolean).join('\n');
  return{
    id:uid(),
    questId:'dqloop_transfer',
    questTitleSnapshot:'DQ Loop 루틴 이체',
    categorySnapshot:'생활/환경',
    difficultySnapshot:'ROUTINE',
    rewardSnapshot:Number(t.amount||0),
    completedAt:t.createdAt||new Date().toISOString(),
    earnedReward:Number(t.amount||0),
    memo,
    source:'dq_loop',
    type:'routine_wallet_transfer',
    routineTransferId:t.id,
    isRoutineTransfer:true,
    rewardedDays:days,
    personaCat:'',
    personaExpGain:0,
    styleCoinGain:0,
    personaBonusLabel:''
  };
}
async function receiveRoutineTransfers(isManual=true){
  if(!githubPAT||!gistID){
    toast('GitHub Token과 Gist ID가 필요합니다.','var(--red)');
    return;
  }
  if(isManual)toast('🔗 DQ Loop 이체 대기열 확인 중...');
  try{
    const prevBal=bk().bal;
    const {backup}=await readDQGistBackup();
    const remoteTransfers=normalizeRoutineTransfers(backup.routineTransfers||[]);
    const appliedIds=new Set(QL.filter(l=>l&&l.routineTransferId).map(l=>l.routineTransferId));
    const pending=remoteTransfers.filter(t=>
      t&&t.id&&t.status==='pending'&&
      (t.source==='myroutine'||t.type==='routine_wallet_transfer')&&
      Number(t.amount||0)>0&&!appliedIds.has(t.id)
    );
    RT=mergeRoutineTransfers(RT,remoteTransfers);
    if(pending.length===0){
      sv(SK.RT,RT);
      if(isManual)toast('📭 수신할 DQ Loop 이체가 없습니다.');
      render();
      return;
    }
    const total=pending.reduce((s,t)=>s+Number(t.amount||0),0);
    if(isManual&&!confirm(`DQ Loop 이체 ${pending.length}건, 총 ${W(total)}을 DQ 잔고에 반영할까요?`))return;
    const now=new Date().toISOString();
    pending.forEach(t=>{
      const log=makeRoutineTransferLog(t);
      QL.push(log);
      t.status='applied';
      t.appliedAt=now;
      t.appliedLogId=log.id;
      t.appliedBy='dq';
    });
    RT=mergeRoutineTransfers(RT,remoteTransfers,pending);
    const nextBackup=makeDQBackupData({...backup,routineTransfers:RT,routineReceivedAt:now});
    await writeDQGistBackup(nextBackup);
    sv(SK.Q,Q);sv(SK.QL,QL);sv(SK.R,R);sv(SK.PL,PL);sv(SK.P,P);sv(SK.RT,RT);sv('dq_main_last_saved',now);
    lastSync=now;sv('dq_main_last_sync',lastSync);
    showFloatText(total,true);
    animateBalance(prevBal,bk().bal);
    explodeParticles(window.innerWidth/2,150,24);
    toast(`🔗 DQ Loop 이체 수신 완료! +${W(total)}`);
    render();
  }catch(e){
    console.error(e);
    if(isManual)toast(`수신 실패: ${e.message}`,'var(--red)');
  }
}
window.receiveRoutineTransfers=receiveRoutineTransfers;


/* ══ GITHUB GIST SYNC ══ */
let _syncTimer = null;
function autoSyncGist() {
  if (!githubPAT) return;
  clearTimeout(_syncTimer);
  _syncTimer = setTimeout(() => {
    syncToGist(false);
  }, 3000); // 3초 뒤 자동 백업 (API 리밋 방지)
}

async function syncToGist(isManual = false) {
  if (!githubPAT) {
    if (isManual) toast('GitHub Token을 먼저 설정해주세요.', 'var(--red)');
    return;
  }
  
  if (isManual) toast('☁️ 클라우드에 백업하는 중...');
  
  let remoteBackup={};
  if(gistID){
    try{
      const got=await readDQGistBackup();
      remoteBackup=got.backup||{};
      RT=mergeRoutineTransfers(RT,remoteBackup.routineTransfers||[]);
      sv(SK.RT,RT);
    }catch(e){
      console.warn('routineTransfers merge skipped',e);
    }
  }
  const data = makeDQBackupData(remoteBackup);
  const content = JSON.stringify(data, null, 2);
  const body = {
    description: "Dopamin Quest Main Backup",
    files: { "dq-backup.json": { content: content } }
  };
  
  try {
    let url = 'https://api.github.com/gists';
    let method = 'POST';
    if (gistID) {
      url += '/' + gistID;
      method = 'PATCH';
    }
    
    const res = await fetch(url, {
      method: method,
      headers: { 'Accept': 'application/vnd.github.v3+json', 'Authorization': `token ${githubPAT}` },
      body: JSON.stringify(body)
    });
    
    if (!res.ok) throw new Error('API Error');
    const resData = await res.json();
    
    if (!gistID) {
      gistID = resData.id;
      sv('dq_main_gist_id', gistID);
    }
    
    lastSync = new Date().toISOString();
    sv('dq_main_last_sync', lastSync);
    
    if (isManual) {
      toast('☁️ 클라우드 수동 백업 완료!');
      render();
    }
  } catch (e) {
    console.error(e);
    if (isManual) toast('☁️ 클라우드 백업 실패 (토큰 확인)', 'var(--red)');
  }
}

async function fetchFromGist() {
  if (!githubPAT || !gistID) {
    toast('GitHub Token과 Gist ID가 필요합니다.', 'var(--red)');
    return;
  }
  toast('☁️ 클라우드에서 데이터 가져오는 중...');
  try {
    const res = await fetch(`https://api.github.com/gists/${gistID}`, {
      headers: { 'Authorization': `token ${githubPAT}` }
    });
    if (!res.ok) throw new Error('API Error');
    const resData = await res.json();
    const file = resData.files["dq-backup.json"];
    if (!file) throw new Error('File not found');
    
    const d = JSON.parse(file.content);
    if(!d.quests || !d.rewards){ throw new Error('Invalid format'); }
    
    if(!confirm('클라우드 데이터로 복원할까요?\n(현재 기기의 데이터가 모두 덮어씌워집니다)')) return;
    
    Q = d.quests; QL = d.questLogs || []; R = d.rewards; PL = d.purchaseLogs || []; P = normalizePersonaState(d.persona); RT = normalizeRoutineTransfers(d.routineTransfers || []);
    
    // 복원 시에는 autoSync가 발동되지 않게 직접 로컬에만 저장
    sv(SK.Q,Q); sv(SK.QL,QL); sv(SK.R,R); sv(SK.PL,PL); sv(SK.P,P); sv(SK.RT,RT); sv('dq_main_last_saved', new Date().toISOString());
    lastSync = new Date().toISOString();
    sv('dq_main_last_sync', lastSync);
    
    toast('📥 클라우드 복원 완료!');
    render();
  } catch(e) {
    console.error(e);
    toast('☁️ 복원 실패 (Gist ID 또는 토큰 확인)', 'var(--red)');
  }
}

  const ts=PL.reduce((s,l)=>s+(l.spentCost||0),0);
  const now=new Date(),ms=new Date(now.getFullYear(),now.getMonth(),1);
  const me=QL.filter(l=>new Date(l.completedAt)>=ms).reduce((s,l)=>s+(l.earnedReward||0),0);
  const msp=PL.filter(l=>new Date(l.purchasedAt)>=ms).reduce((s,l)=>s+(l.spentCost||0),0);

}

const PARTS=['⭐','✨','💫','🌟','💥','🎉','🎊','⚡','💰','🔥'];
function explodeParticles(x,y,n=14){
  const canvas=document.getElementById('particle-canvas');
  canvas.width=window.innerWidth;canvas.height=window.innerHeight;
  const ctx=canvas.getContext('2d');ctx.clearRect(0,0,canvas.width,canvas.height);
  const ps=[];
  for(let i=0;i<n;i++){const a=(Math.PI*2/n)*i+Math.random()*.5,sp=80+Math.random()*120;ps.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-60,life:1,emoji:PARTS[Math.floor(Math.random()*PARTS.length)],size:16+Math.random()*12,rot:Math.random()*360,rotV:(Math.random()-.5)*20})}
  let last=performance.now();
  (function frame(now){const dt=(now-last)/1000;last=now;ctx.clearRect(0,0,canvas.width,canvas.height);let alive=false;
    ps.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=280*dt;p.life-=dt*1.4;p.rot+=p.rotV;if(p.life<=0)return;alive=true;ctx.save();ctx.globalAlpha=Math.max(0,p.life);ctx.font=`${p.size}px serif`;ctx.translate(p.x,p.y);ctx.rotate(p.rot*Math.PI/180);ctx.fillText(p.emoji,-p.size/2,-p.size/2);ctx.restore()});
    if(alive)requestAnimationFrame(frame);else ctx.clearRect(0,0,canvas.width,canvas.height)})(performance.now());
}

let _balRaf=null;
function animateBalance(from,to){
  if(_balRaf)cancelAnimationFrame(_balRaf);
  const dur=700,start=performance.now();
  const el=document.getElementById('bank-amount-val');if(!el)return;
  (function step(now){const t=Math.min((now-start)/dur,1);const ease=t<.5?2*t*t:(4-2*t)*t-1;
    const cur=Math.round(from+(to-from)*ease);if(el)el.textContent=W(cur);
    if(t<1)_balRaf=requestAnimationFrame(step);else{if(el)el.textContent=W(to)}})(start);
}

function finalizeParentQuestIfComplete(child){
  const parent=questParent(child);if(!parent||parent.status==='완료')return null;
  const before=subProgress(parent);
  if(!before.total||before.done<before.total)return null;
  const completedAt=new Date().toISOString();
  const prevPersona=buildPersonaStats();
  const parentCat=migrateCat(parent.category||child.category||'몸');
  const gain=personaRewardForQuest(parent,parent.reward,prevPersona,parentCat);
  QL.push({id:uid(),questId:parent.id,questTitleSnapshot:`🏆 ${parent.title} 완주 보너스`,categorySnapshot:parentCat,difficultySnapshot:parent.difficulty,rewardSnapshot:parent.reward,completedAt,earnedReward:parent.reward,memo:`하위 퀘스트 ${before.done}/${before.total} 완료`,personaCat:parentCat,personaExpGain:gain.exp,styleCoinGain:gain.coins,personaBonusLabel:gain.bonusLabel||'',isParentBonus:true,parentQuestId:parent.id,completedSubCount:before.done,totalSubCount:before.total});
  parent.completedCount=(parent.completedCount||0)+1;parent.totalEarned=(parent.totalEarned||0)+Number(parent.reward||0);parent.lastCompletedAt=completedAt;parent.status='완료';
  const personaResult=applyPersonaProgress(parent,prevPersona,gain);
  return{parent,progress:before,personaResult};
}
function doComplete(id,btnEl){
  const q=Q.find(x=>x.id===id);if(!q)return;
  if(q.type==='단발'&&q.status==='완료'){toast('이미 완료된 퀘스트예요 ✓');return}
  const rect=btnEl?btnEl.getBoundingClientRect():{left:window.innerWidth/2,top:200,width:0,height:0};
  const cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;
  memoM(q.type==='반복'?`🔁 ${q.title}`:`✅ ${q.title}`,`+${W(q.reward)} 적립`,memo=>{
    const prevBal=bk().bal;
    const prevLv=getLevel(bk().te).level;
    const prevPersona=buildPersonaStats();
    const personaCat=migrateCat(q.category||'몸');
    const personaGain=personaRewardForQuest(q,q.reward,prevPersona,personaCat);
    const completedAt=new Date().toISOString();
    
    QL.push({id:uid(),questId:q.id,questTitleSnapshot:q.title,categorySnapshot:personaCat,difficultySnapshot:q.difficulty,rewardSnapshot:q.reward,completedAt,earnedReward:q.reward,memo,personaCat,personaExpGain:personaGain.exp,styleCoinGain:personaGain.coins,personaBonusLabel:personaGain.bonusLabel||''});
    q.completedCount=(q.completedCount||0)+1;q.totalEarned=(q.totalEarned||0)+q.reward;q.lastCompletedAt=completedAt;
    if(q.type==='단발'||q.parentId)q.status='완료';
    const personaResult=applyPersonaProgress(q,prevPersona,personaGain);
    const parentAuto=finalizeParentQuestIfComplete(q);
    const routeFinal=isQuestInTodayRoute(q.id)?finalizeDailyRouteIfComplete():null;
    saveAll();closeM();explodeParticles(cx,cy);setTimeout(()=>flashCard(q.id),100);
    showFloatText(q.reward,true);animateBalance(prevBal,bk().bal);
    toast(q.type==='반복'?`🔁 클리어! +${W(q.reward)}`:`🎉 완료! +${W(q.reward)}`);
    setTimeout(()=>toast(`${PERSONA_CFG[personaResult.cat].emoji} ${personaResult.cat} EXP +${personaResult.gain.exp} · 🪙 +${personaResult.gain.coins}${personaResult.gain.bonusLabel?' · 보너스 적용':''}`),450);
    if(parentAuto)setTimeout(()=>toast(`🏆 ${parentAuto.parent.title} 완주 보너스 +${W(parentAuto.parent.reward||0)}`),700);
    if(routeFinal)setTimeout(()=>showDailyRouteCompleteModal(routeFinal),950);
    else if(isQuestInTodayRoute(q.id))setTimeout(()=>showDailyRouteProgressToast(),850);
    if(personaResult.leveled)setTimeout(()=>showPersonaLevelUp(personaResult),personaResult.awakened?1050:900);
    checkNewlyUnlocked(prevBal,bk().bal);
    
    const curLvData = getLevel(bk().te);
    if(curLvData.level > prevLv) {
      setTimeout(()=>showLevelUpModal(curLvData), 600);
    }
    if(prevLv < 10 && curLvData.level >= 10){
      setTimeout(()=>showPersonaUnlockModal(), 1500);
    }
    
    render();
  });
}

window._delQL=lid=>{
  const l=QL.find(x=>x.id===lid);if(!l)return;
  const q=Q.find(x=>x.id===l.questId);
  if(q){
    q.completedCount=Math.max(0,(q.completedCount||0)-1);q.totalEarned=Math.max(0,(q.totalEarned||0)-l.earnedReward);
    if(q.type==='단발'&&q.status==='완료'){q.status='진행중';q.lastCompletedAt=''}
    else{const prev=QL.filter(x=>x.id!==lid&&x.questId===q.id).sort((a,b)=>new Date(b.completedAt)-new Date(a.completedAt));q.lastCompletedAt=prev[0]?.completedAt||''}
  }
  QL=QL.filter(x=>x.id!==lid);saveAll();closeM();toast('퀘스트 로그 삭제됐어요');render();
};
window._delPL=lid=>{
  const l=PL.find(x=>x.id===lid);if(!l)return;
  const r=R.find(x=>x.id===l.rewardId);
  if(r){r.totalPurchasedCount=Math.max(0,(r.totalPurchasedCount||0)-1);r.totalSpent=Math.max(0,(r.totalSpent||0)-l.spentCost)}
  PL=PL.filter(x=>x.id!==lid);saveAll();closeM();toast('구매 로그 삭제됐어요');render();
};
window._clearLogs=(type)=>{
  if(!confirm(`검색된 ${type==='quest'?'퀘스트':'구매'} 로그를 일괄 삭제하시겠습니까?\n(잔고 및 퀘스트 진행도가 다시 계산됩니다)`)) return;
  const isQ = type === 'quest';
  
  if(isQ) {
    const idsToDelete = QL.filter(l => (l.questTitleSnapshot||'').toLowerCase().includes(logSearch.toLowerCase())).map(l=>l.id);
    idsToDelete.forEach(id => {
        const l = QL.find(x=>x.id===id);
        const q = Q.find(x=>x.id===l.questId);
        if(q){
            q.completedCount=Math.max(0,(q.completedCount||0)-1);
            q.totalEarned=Math.max(0,(q.totalEarned||0)-l.earnedReward);
            if(q.type==='단발'&&q.status==='완료'){q.status='진행중';q.lastCompletedAt=''}
        }
    });
    QL = QL.filter(l => !idsToDelete.includes(l.id));
  } else {
    const idsToDelete = PL.filter(l => (l.rewardTitleSnapshot||'').toLowerCase().includes(logSearch.toLowerCase())).map(l=>l.id);
    idsToDelete.forEach(id => {
        const l = PL.find(x=>x.id===id);
        const r = R.find(x=>x.id===l.rewardId);
        if(r){
            r.totalPurchasedCount=Math.max(0,(r.totalPurchasedCount||0)-1);
            r.totalSpent=Math.max(0,(r.totalSpent||0)-l.spentCost);
        }
    });
    PL = PL.filter(l => !idsToDelete.includes(l.id));
  }
  saveAll(); toast('선택된 로그가 전체 삭제되었습니다.'); render();
};

/* ══ CARDS & LOGS ══ */
function getDueStatus(q){
  if(!q.dueDate)return null;
  const due=TODATE(q.dueDate);
  const diff=Math.round((due-TODAY)/(1000*60*60*24));
  if(diff<0)return'overdue';
  if(diff<=3)return'soon';
  return'ok';
}


function questParent(q){return q&&q.parentId?Q.find(x=>x.id===q.parentId):null}
function childQuests(parentId){return Q.filter(x=>x.parentId===parentId).sort((a,b)=>(Number(a.subOrder||0)-Number(b.subOrder||0))||new Date(a.createdAt||0)-new Date(b.createdAt||0))}
function isParentQuest(q){return !!(q&&childQuests(q.id).length)}
function isSubQuest(q){return !!(q&&q.parentId)}
function isStepDone(q){return q&&((q.status==='완료')||(q.parentId&&Number(q.completedCount||0)>0))}
function topLevelQuests(list){return list.filter(q=>!q.parentId)}
function isAccordionOpen(id){return OPEN_PARENTS.includes(id)}
function toggleAccordion(id){OPEN_PARENTS=isAccordionOpen(id)?OPEN_PARENTS.filter(x=>x!==id):[...OPEN_PARENTS,id];saveOpenParents();_uq&&_uq()}
function subProgress(parent){const subs=childQuests(parent.id);const done=subs.filter(s=>isStepDone(s)).length;return{total:subs.length,done,pct:subs.length?Math.round(done/subs.length*100):0,subs,next:subs.find(s=>s.status!=='완료')||null}}
function nextSubOrder(parentId){const subs=childQuests(parentId);return subs.length?Math.max(...subs.map(s=>Number(s.subOrder||0)))+1:1}
function dashboardQuestPriority(q){
  const st=getDueStatus(q);
  if(st==='overdue')return 0;
  if(st==='soon')return 1;
  if(isSubQuest(q))return 2;
  if(isParentQuest(q))return 3;
  if(q.type==='단발')return 4;
  if(q.type==='반복')return 5;
  return 6;
}
function dashboardActiveQuests(){
  return Q.filter(q=>q.status==='진행중').sort((a,b)=>{
    const dueA=a.dueDate?TODATE(a.dueDate).getTime():8640000000000000;
    const dueB=b.dueDate?TODATE(b.dueDate).getTime():8640000000000000;
    return dashboardQuestPriority(a)-dashboardQuestPriority(b)||dueA-dueB||Number(a.subOrder||0)-Number(b.subOrder||0)||new Date(a.createdAt||0)-new Date(b.createdAt||0);
  });
}

function getREmoji(r){return r.remoji||'🎁'}
function rewardAutoRank(cost){
  const c=Number(cost||0);
  if(c>=1500000)return 'S';
  if(c>=500000)return 'A';
  if(c>=100000)return 'B';
  return 'C';
}
function rewardRank(r){return rewardAutoRank(r?.cost||0)}
function rewardRankLabel(rank){return ({S:'S · 150만원 이상',A:'A · 50~149만원',B:'B · 10~49만원',C:'C · 10만원 미만'})[rank]||'자동'}
function manwon(n){return Math.round(Number(n||0)/1000)/10}
function manwonText(n){const v=manwon(n);return Number.isInteger(v)?`${v}만원`:`${v.toFixed(1)}만원`}
function normalizeRewardAutoRanks(){if(!Array.isArray(R))R=JSON.parse(JSON.stringify(SR));let changed=false;(R||[]).forEach(r=>{if(!r)return;const ar=rewardAutoRank(r.cost);if(r.rank!==ar){r.rank=ar;changed=true}});return changed}
function rewardPriceBucket(r){const c=Number(r.cost||0);if(c<100000)return '10만원 미만';if(c<500000)return '10~49만원';if(c<1500000)return '50~149만원';return '150만원 이상'}
function rewardFilteredList(){
  const b=bk();let f=Array.isArray(R)?[...R]:[];
  f=f.filter(Boolean).map(r=>({...r,cost:Number(r.cost||0),rank:rewardRank(r)}));
  if(rT==='구매가능')f=f.filter(r=>r.cost<=b.bal);
  else if(['S','A','B','C'].includes(rT))f=f.filter(r=>rewardRank(r)===rT);
  if(rCatFilter&&rCatFilter!=='전체')f=f.filter(r=>(r.rcat||'stuff')===rCatFilter);
  if(rSearch){const s=String(rSearch).toLowerCase();f=f.filter(r=>[r.title||'',r.rewardModule||'',r.rules||'',(RC_CATS.find(c=>c.cat===r.rcat)||{}).label||'',rewardPriceBucket(r)].join(' ').toLowerCase().includes(s));}
  const min=rMinMan===''?null:Number(rMinMan)*10000,max=rMaxMan===''?null:Number(rMaxMan)*10000;
  if(min!==null&&!Number.isNaN(min))f=f.filter(r=>Number(r.cost||0)>=min);
  if(max!==null&&!Number.isNaN(max))f=f.filter(r=>Number(r.cost||0)<=max);
  if(rSort==='cost_asc')f.sort((a,b)=>(a.cost||0)-(b.cost||0));
  else if(rSort==='cost_desc')f.sort((a,b)=>(b.cost||0)-(a.cost||0));
  else if(rSort==='rank')f.sort((a,b)=>['S','A','B','C'].indexOf(rewardRank(a))-['S','A','B','C'].indexOf(rewardRank(b))||(a.cost||0)-(b.cost||0));
  else if(rSort==='name')f.sort((a,b)=>String(a.title||'').localeCompare(String(b.title||''),'ko'));
  else f.sort((a,b)=>{const ab=(a.cost<=b.bal?0:1),bb=(b.cost<=b.bal?0:1);return ab-bb||(a.cost||0)-(b.cost||0)});
  return f;
}

function rewardListHTML(list){
  if(!list.length)return `<div class="empty"><div class="empty-ico">🎁</div><div class="empty-txt">조건에 맞는 리워드가 없어요<br>금액대나 검색어를 줄여보세요</div></div>`;

}

    <div class="log-amt ${isE?'log-earn':'log-spend'}">${isE?'+':'-'}${W(l.earnedReward||l.spentCost)}</div>
  </div>`;
}

/* ══ GET QUEST LIST (부분 렌더링용) ══ */
function questMatchesFilter(q){
  if(!q)return false;
  if(qFilter==='전체')return true;
  if(qFilter==='반복')return q.type==='반복';
  if(qFilter==='단발')return q.type==='단발';
  if(qFilter==='완료')return q.status==='완료';
  if(qFilter==='예정')return q.status==='예정';
  if(qFilter==='기한초과')return q.dueDate&&getDueStatus(q)==='overdue';
  if(qFilter==='마감임박')return q.dueDate&&getDueStatus(q)==='soon';
  if(qFilter==='하위퀘스트')return isSubQuest(q);
  return true;
}
function applyQuestSearchAndSort(list){
  let f=[...list];
  if(qFilter&&qFilter!=='전체')f=f.filter(questMatchesFilter);
  if(qSearch){
    const s=qSearch.toLowerCase();
    f=f.filter(q=>{
      const p=questParent(q);
      const childHit=isParentQuest(q)&&childQuests(q.id).some(c=>String(c.title||'').toLowerCase().includes(s)||String(c.condition||'').toLowerCase().includes(s));
      return String(q.title||'').toLowerCase().includes(s)||migrateCat(q.category||'').toLowerCase().includes(s)||String(q.condition||'').toLowerCase().includes(s)||String(q.story||'').toLowerCase().includes(s)||childHit||(p&&String(p.title||'').toLowerCase().includes(s));
    });
  }
  const urgency=(q)=>{const st=getDueStatus(q);if(st==='overdue')return 0;if(st==='soon')return 1;if(isParentQuest(q)&&subProgress(q).next)return 2;if(q.status==='진행중')return 3;if(q.status==='예정')return 4;if(q.status==='완료')return 5;return 6};
  if(qSort==='urgent')f.sort((a,b)=>urgency(a)-urgency(b)||((a.dueDate?TODATE(a.dueDate).getTime():8640000000000000)-(b.dueDate?TODATE(b.dueDate).getTime():8640000000000000)));
  else if(qSort==='reward_desc')f.sort((a,b2)=>(b2.reward||0)-(a.reward||0));
  else if(qSort==='reward_asc')f.sort((a,b2)=>(a.reward||0)-(b2.reward||0));
  else if(qSort==='diff')f.sort((a,b2)=>['S','A','B','C'].indexOf(a.difficulty)-['S','A','B','C'].indexOf(b2.difficulty));
  else if(qSort==='recent')f.sort((a,b2)=>new Date(b2.lastCompletedAt||0)-new Date(a.lastCompletedAt||0));
  else if(qSort==='due')f.sort((a,b2)=>{const da=a.dueDate?new Date(a.dueDate):new Date('9999');const db=b2.dueDate?new Date(b2.dueDate):new Date('9999');return da-db});
  return f;
}
function sectionHTML(title,items,emoji){
  if(!items.length)return'';
  return `<div class="quest-section-title"><span>${emoji} ${title}</span><span class="quest-section-count">${items.length}개</span></div>${items.map(q=>qCard(q)).join('')}`;
}
function getQuestListHTML(){
  if(qT==='추천퀘스트')return getRecommendedQuestListHTML();
  if(qT==='오늘루트')return getDailyRouteHTML();
  let base=Q;
  if(qT==='진행중')base=Q.filter(q=>q.status==='진행중');
  else if(qT==='메인')base=Q.filter(q=>isParentQuest(q));
  else base=Q.filter(q=>!q.parentId);
  let f=applyQuestSearchAndSort(base);
  if(qT==='진행중'&&qFilter==='전체'&&!qSearch){
    const used=new Set();
    const urgent=f.filter(q=>{const st=getDueStatus(q);return st==='overdue'||st==='soon'}); urgent.forEach(q=>used.add(q.id));
    const sub=f.filter(q=>!used.has(q.id)&&isSubQuest(q)); sub.forEach(q=>used.add(q.id));
    const main=f.filter(q=>!used.has(q.id)&&isParentQuest(q)); main.forEach(q=>used.add(q.id));
    const normal=f.filter(q=>!used.has(q.id)&&!isParentQuest(q)&&!isSubQuest(q)&&q.type!=='반복'); normal.forEach(q=>used.add(q.id));
    const repeat=f.filter(q=>!used.has(q.id)&&!isSubQuest(q)&&q.type==='반복');
    const html=sectionHTML('지금 먼저 할 것',urgent,'🔥')+sectionHTML('연계 하위 퀘스트',sub,'🔗')+sectionHTML('메인 퀘스트',main,'🏔️')+sectionHTML('일반 퀘스트',normal,'⚔️')+sectionHTML('반복 퀘스트',repeat,'🔁');
    return html||`<div class="empty"><div class="empty-ico">🗺️</div><div class="empty-txt">퀘스트가 없어요</div></div>`;
  }
  return f.length===0?`<div class="empty"><div class="empty-ico">🗺️</div><div class="empty-txt">퀘스트가 없어요</div></div>`:f.map(q=>qCard(q)).join('');
}
